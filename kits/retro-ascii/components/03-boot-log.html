<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro ASCII · Component · Boot log</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:48px}
  .demo-tag{position:absolute;top:18px;left:24px;font-family:var(--ra-font-mono);font-size:10px;color:var(--ra-c-dim);letter-spacing:.20em;text-transform:uppercase}
  .demo{width:520px;height:340px}
  .log{font-size:11px;white-space:pre-wrap;line-height:1.6;height:100%;overflow:hidden}
  .log .ra-line{display:block}
</style>
</head>
<body class="ra-crt">
<span class="demo-tag">03 · boot log stream</span>
<article class="ra-panel demo">
  <div class="ra-ttl">
    BOOT SEQUENCE
    <span class="id">/var/log/boot.0</span>
  </div>
  <div class="ra-body">
    <div class="log" id="log"></div>
    <span class="ra-cursor" style="margin-top:4px"></span>
  </div>
</article>
<script>
  // Boot log streams line-by-line at random 60-180ms cadence — that variability
  // is what makes it feel like a real spool, not a CSS animation.
  var lines = [
    ['dim', '[0.000] Loading retro-ascii kernel v0.9.1 ...'],
    ['ok',  '[0.012] CPU: 8 cores online · P1 phosphor'],
    ['ok',  '[0.048] MEM: 32768 MiB · scrub clean'],
    ['ok',  '[0.121] Mount /dev/sda1 -> /            [ OK ]'],
    ['dim', '[0.318] Probing glyph link ...'],
    ['warn','[0.412] glyph link: weak, retry (1/3)'],
    ['ok',  '[0.622] glyph link: locked @ 38.2 Hz'],
    ['ok',  '[0.812] systemd-ascii.service       [ OK ]'],
    ['ok',  '[0.914] ansi-ticker.service         [ OK ]'],
    ['ok',  '[1.024] crt-phosphor.service        [ OK ]'],
    ['warn','[1.124] clock drift +2ms, fixed'],
    ['ok',  '[1.204] Skills: retro, glyph, crt, ansi'],
    ['err', '[1.311] WARN: capslock fused'],
    ['ok',  '[1.402] Welcome back, karo.'],
    ['dim', '[1.403] type `help` to begin.']
  ];
  var log = document.getElementById('log');
  var i = 0;
  function next(){
    if (i >= lines.length){
      // Loop the spool
      setTimeout(function(){ log.innerHTML=''; i=0; next(); }, 1800);
      return;
    }
    var L = lines[i++];
    var el = document.createElement('span');
    el.className = 'ra-line is-' + L[0];
    el.textContent = L[1];
    log.appendChild(el);
    setTimeout(next, 60 + Math.random() * 120);
  }
  next();
</script>
</body>
</html>
