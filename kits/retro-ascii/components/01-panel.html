<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro ASCII · Component · Panel</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:48px}
  .demo-tag{position:absolute;top:18px;left:24px;font-family:var(--ra-font-mono);font-size:10px;color:var(--ra-c-dim);letter-spacing:.20em;text-transform:uppercase}
  .demo{width:520px}
  .ra-panel p{font-size:12px;color:var(--ra-c-ink);margin-top:6px;line-height:1.6}
</style>
</head>
<body class="ra-crt">
<span class="demo-tag">01 · panel</span>
<article class="ra-panel demo">
  <div class="ra-ttl">
    <span class="ra-dot"></span>
    SIGNAL WAVE
    <span class="id">ch-0 · noise</span>
  </div>
  <p>The bracket corners (top-left + bottom-right) are the panel signature. Keep them. Translucent fill lets the page-level radial bloom bleed through and gives the panel its phosphor depth.</p>
  <div class="ra-tape" style="margin-top:14px">CHO 38.2 HZ · RMS 0.71 · SNR 92DB</div>
</article>
</body>
</html>
