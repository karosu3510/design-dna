<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>03 · Poster Tile</title>
<link rel="stylesheet" href="../design-system.css">
<style>html,body{margin:0;height:100%}body{background:var(--vg-c-void);color:var(--vg-c-ink);font-family:var(--vg-font-sans);display:grid;place-items:center;padding:48px}
.grid{display:grid;grid-template-columns:repeat(4,160px);gap:14px}
.tile{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform 260ms cubic-bezier(.16,1,.3,1)}
.tile:hover{transform:scale(1.04)}
.tile .img{position:absolute;inset:0;background-size:cover;background-position:50% 50%;background-color:var(--vg-c-shell)}
.tile::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);pointer-events:none}
.tile .meta{position:absolute;left:10px;bottom:10px;right:10px;display:flex;justify-content:space-between;align-items:end;font-family:var(--vg-font-mono);font-size:10px;letter-spacing:.18em;color:#fff;text-transform:uppercase;opacity:0;transition:opacity 260ms ease;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.tile:hover .meta{opacity:1}
</style></head>
<body class="vg">
<div class="grid">
  <div class="tile"><div class="img" style="background:linear-gradient(160deg,#3a78ff 0%, #1a1a3a 100%)"></div><div class="meta"><span>OPUS-01</span><span>1953</span></div></div>
  <div class="tile"><div class="img" style="background:linear-gradient(160deg,#ff7a3d 0%, #6a2310 100%)"></div><div class="meta"><span>OPUS-02</span><span>1962</span></div></div>
  <div class="tile"><div class="img" style="background:linear-gradient(160deg,#ffd24a 0%, #6a4810 100%)"></div><div class="meta"><span>OPUS-03</span><span>1955</span></div></div>
  <div class="tile"><div class="img" style="background:linear-gradient(160deg,#fafafa 0%, #2a2a2a 100%)"></div><div class="meta"><span>OPUS-04</span><span>1948</span></div></div>
</div>
</body></html>
