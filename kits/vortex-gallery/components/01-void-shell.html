<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>01 · Void Shell</title>
<link rel="stylesheet" href="../design-system.css">
<style>html,body{margin:0;height:100%}body{background:var(--vg-c-void);color:var(--vg-c-ink);font-family:var(--vg-font-sans);display:grid;place-items:center;padding:48px}
.demo{width:520px}
.shell{padding:32px}
.shell .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.shell h2{font-size:22px;font-weight:500;letter-spacing:-.02em;margin:0}
.shell .meta{font-family:var(--vg-font-mono);font-size:10px;letter-spacing:.24em;color:var(--vg-c-ink-3);text-transform:uppercase}
.shell p{font-size:13.5px;color:var(--vg-c-ink-2);line-height:1.55;margin:0 0 18px;max-width:48ch}
.shell .pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 16px;background:var(--vg-c-ember);color:#0a0a0a;border-radius:999px;font-size:12px;font-weight:500;border:0;cursor:pointer}
</style></head>
<body class="vg">
<div class="demo">
  <div class="vg-shell shell">
    <div class="row">
      <h2>The vortex archive</h2>
      <span class="meta">01 / 24</span>
    </div>
    <p>Card surface sits one tier above the void canvas — `--vg-c-depth` (#101010) with a 1px hairline at white-8% and a 24px black-60% drop shadow. The 1px white-4% inset on top mimics light catching a paper edge.</p>
    <button class="pill">View archive →</button>
  </div>
</div>
</body></html>
