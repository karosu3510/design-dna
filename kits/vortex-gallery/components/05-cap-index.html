<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>05 · Cap Index</title>
<link rel="stylesheet" href="../design-system.css">
<style>html,body{margin:0;height:100%}body{background:var(--vg-c-void);color:var(--vg-c-ink);font-family:var(--vg-font-sans);display:grid;place-items:center;padding:48px}
.list{width:480px}
.row{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0;border-top:1px solid var(--vg-c-line);transition:opacity 260ms ease}
.row:first-child{border-top:0}
.row:hover{opacity:.55}
.row.active:hover{opacity:1}
.idx{font-family:var(--vg-font-mono);font-size:10px;letter-spacing:.24em;color:var(--vg-c-ink-3);width:60px}
.title{font-size:17px;font-weight:500;letter-spacing:-.005em;flex:1}
.year{font-family:var(--vg-font-mono);font-size:10px;letter-spacing:.24em;color:var(--vg-c-ink-3)}
.row.active .idx{color:var(--vg-c-ember)}
.row.active .title{color:var(--vg-c-ember)}
.title-cap{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--vg-c-ink-3);font-family:var(--vg-font-mono);margin-bottom:14px}
</style></head>
<body class="vg">
<div class="list">
  <div class="title-cap">Catalogue · Vol I</div>
  <div class="row"><span class="idx">01 / 24</span><span class="title">Footage, not a feed</span><span class="year">1953</span></div>
  <div class="row"><span class="idx">02 / 24</span><span class="title">Pacific Coast Highway</span><span class="year">1955</span></div>
  <div class="row active"><span class="idx">03 / 24</span><span class="title">Friendly Business</span><span class="year">1948</span></div>
  <div class="row"><span class="idx">04 / 24</span><span class="title">The Thrill That Comes</span><span class="year">1962</span></div>
  <div class="row"><span class="idx">05 / 24</span><span class="title">Yellowstone Boulevards</span><span class="year">1957</span></div>
</div>
</body></html>
