<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>a.Record · Component · Status dot</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;background:var(--ar-c-bg);padding:40px}
  .demo-tag{position:absolute;top:18px;left:24px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ar-c-ink-3);font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;width:760px}
  .status{height:78px;border-radius:16px;background:var(--ar-c-softer);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
  .status .lbl{font-size:14px;font-weight:500;color:var(--ar-c-ink)}
  .status .lbl small{display:block;font-size:11.5px;font-weight:400;color:var(--ar-c-ink-3);margin-top:4px;letter-spacing:0}
  .row-label{grid-column:1/-1;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ar-c-ink-3);font-weight:500;margin-bottom:-8px}
  /* idle dot variant */
  .ar-idle-dot{width:14px;height:14px;border-radius:50%;background:var(--ar-c-ink-4);box-shadow:0 0 0 4px rgba(28,28,26,.05)}
</style>
</head>
<body>
<span class="demo-tag">04 · ar-rec-dot</span>
<div class="grid">
  <div class="row-label">States</div>
  <div class="status">
    <div class="lbl">Recording active <small>Take 04 · 12:35</small></div>
    <span class="ar-rec-dot"></span>
  </div>
  <div class="status">
    <div class="lbl">Standby <small>Awaiting input</small></div>
    <span class="ar-idle-dot"></span>
  </div>
</div>
</body>
</html>
