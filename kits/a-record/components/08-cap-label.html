<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>a.Record · Component · Cap label</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;background:var(--ar-c-bg);padding:40px}
  .demo-tag{position:absolute;top:18px;left:24px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ar-c-ink-3);font-weight:500}
  .stage{display:flex;flex-direction:column;gap:32px;align-items:flex-start;width:680px}
  .panel{width:100%;background:var(--ar-c-shell);border:1px solid var(--ar-c-line-2);border-radius:16px;padding:18px 20px;box-shadow:var(--ar-shadow-pill)}
  .panel .ar-cap + h2{margin-top:6px;font-size:24px;font-weight:500;letter-spacing:-0.02em;color:var(--ar-c-ink)}
  .row-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ar-c-ink-3);font-weight:500;margin-bottom:-8px}
</style>
</head>
<body>
<span class="demo-tag">08 · cap-label</span>
<div class="stage">
  <div class="row-label">Section heading</div>
  <div class="panel">
    <span class="ar-cap">Block A · Take 04</span>
    <h2>Vocal tracking</h2>
  </div>
  <div class="panel">
    <span class="ar-cap" style="letter-spacing:0.20em">Studio session</span>
    <h2>Neumann U87 · 48 kHz</h2>
  </div>
</div>
</body>
</html>
