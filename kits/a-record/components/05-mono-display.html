<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>a.Record · Component · Mono display</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;background:var(--ar-c-bg);padding:40px}
  .demo-tag{position:absolute;top:18px;left:24px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ar-c-ink-3);font-weight:500}
  .stage{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:920px}
  .tile{height:160px;background:var(--ar-c-shell);border:1px solid var(--ar-c-line-2);border-radius:16px;padding:18px 22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--ar-shadow-pill)}
  .tile .cap{font-size:10.5px;font-weight:500;color:var(--ar-c-ink-3);letter-spacing:.18em;text-transform:uppercase}
  .tile em{font-style:normal;font-family:var(--ar-font-mono);font-weight:200;font-size:48px;letter-spacing:-0.04em;line-height:1;color:var(--ar-c-ink);font-variant-numeric:tabular-nums}
  .tile small{font-size:12px;color:var(--ar-c-ink-3)}
  .row-label{grid-column:1/-1;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ar-c-ink-3);font-weight:500;margin-bottom:-8px}
</style>
</head>
<body>
<span class="demo-tag">05 · ar-mono</span>
<div class="stage">
  <div class="row-label">Tabular numerals · Geist Mono</div>
  <div class="tile"><span class="cap">Elapsed</span><em>12:35:42</em><small>HH : MM : SS</small></div>
  <div class="tile"><span class="cap">Input level</span><em>−11</em><small>dBFS · peak</small></div>
  <div class="tile"><span class="cap">Storage</span><em>4.2 TB</em><small>WAV 24-bit / 48 kHz</small></div>
</div>
</body>
</html>
