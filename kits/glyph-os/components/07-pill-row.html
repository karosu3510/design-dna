<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glyph OS · Component · Pill row</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:48px}
  .demo{width:480px}
  .list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .grip{display:grid;grid-template-columns:repeat(3,3px);grid-template-rows:repeat(2,3px);gap:2px}
  .grip i{width:3px;height:3px;background:var(--gl-c-ink-3);border-radius:1px}
  .demo-tag{position:absolute;top:18px;left:24px;font-family:var(--gl-font-pixel);font-size:13px;color:var(--gl-c-ink-3);letter-spacing:.18em;text-transform:uppercase}
</style>
</head>
<body>
<span class="demo-tag">07 · pill row</span>
<article class="gl-card demo">
  <div class="gl-cap">Quick bus <span class="gl-actions"><span></span></span></div>
  <div class="list">
    <div class="gl-row"><span>Wi-Fi 6E</span><span class="grip"><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
    <div class="gl-row"><span>Glyph Sync</span><span class="grip"><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
    <div class="gl-row"><span>Mic Gate</span><span class="grip"><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
    <div class="gl-row"><span>Focus Lock</span><span class="grip"><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
  </div>
</article>
</body>
</html>
