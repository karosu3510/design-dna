<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glyph OS · Component · Module card</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:48px}
  .stage{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:760px}
  .demo-tag{position:absolute;top:18px;left:24px;font-family:var(--gl-font-pixel);font-size:13px;color:var(--gl-c-ink-3);letter-spacing:.18em;text-transform:uppercase}
</style>
</head>
<body>
<span class="demo-tag">02 · module card</span>
<div class="stage">
  <article class="gl-card">
    <div class="gl-cap">Default <span class="gl-actions"><span></span></span></div>
    <div class="gl-pixel" style="margin-top:14px;font-size:30px">SYNC OK</div>
    <div class="gl-tape" style="margin-top:18px">8 modules · 2 buses · clean</div>
  </article>
  <article class="gl-card gl-card--inverse">
    <div class="gl-cap">Inverse · max 1× <span class="gl-actions"><span></span></span></div>
    <h3 style="margin-top:10px;font-family:var(--gl-font-sans);font-size:18px;font-weight:600;letter-spacing:-0.01em">Now playing</h3>
    <p style="margin-top:4px;font-size:12.5px;color:#5a5a5a">Reserved for content meant to read like paper inside the OS.</p>
  </article>
</div>
</body>
</html>
