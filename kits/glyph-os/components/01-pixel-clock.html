<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glyph OS · Component · Pixel clock</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:48px}
  .demo{width:520px}
  .demo-tag{position:absolute;top:18px;left:24px;font-family:var(--gl-font-pixel);font-size:13px;color:var(--gl-c-ink-3);letter-spacing:.18em;text-transform:uppercase}
</style>
</head>
<body>
<span class="demo-tag">01 · pixel clock</span>
<article class="gl-card demo">
  <div class="gl-cap">Device clock <span class="gl-rec"></span></div>
  <div class="gl-display" id="clock">16:48</div>
  <div class="gl-tape" style="margin-top:10px" id="meta">SAT, MAY 16 :49</div>
</article>
<script>
  function pad(n){ return n < 10 ? '0' + n : n; }
  function tick(){
    var d = new Date();
    document.getElementById('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    var months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    document.getElementById('meta').textContent = days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ' :' + pad(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
