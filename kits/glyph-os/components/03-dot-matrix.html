<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glyph OS · Component · Glyph matrix</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:48px}
  .demo{width:680px}
  .grid{margin-top:10px;display:grid;grid-template-columns:repeat(28,1fr);grid-template-rows:repeat(11,1fr);gap:3px;height:170px}
  .grid i{background:var(--gl-c-card-2);border-radius:1.5px}
  .grid i.l1{background:#3a3a3a}
  .grid i.l2{background:#7c7c7c}
  .grid i.l3{background:#fff}
  .demo-tag{position:absolute;top:18px;left:24px;font-family:var(--gl-font-pixel);font-size:13px;color:var(--gl-c-ink-3);letter-spacing:.18em;text-transform:uppercase}
</style>
</head>
<body>
<span class="demo-tag">03 · glyph matrix</span>
<article class="gl-card demo">
  <div class="gl-cap">Glyph matrix <span class="gl-actions"><span></span></span></div>
  <div class="grid" id="g"></div>
</article>
<script>
  var g = document.getElementById('g'), cells = 28*11;
  for(var i=0;i<cells;i++){
    var d = document.createElement('i');
    var r = Math.random();
    if(r > 0.92) d.classList.add('l3');
    else if(r > 0.78) d.classList.add('l2');
    else if(r > 0.5) d.classList.add('l1');
    g.appendChild(d);
  }
  setInterval(function(){
    var idx = Math.floor(Math.random() * cells);
    var dot = g.children[idx]; if(!dot) return;
    var prev = dot.className; dot.className = 'l3';
    setTimeout(function(){ dot.className = prev; }, 220);
  }, 110);
</script>
</body>
</html>
