<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glyph OS · Component · Pixel meter</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:48px}
  .stage{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:760px}
  .demo-tag{position:absolute;top:18px;left:24px;font-family:var(--gl-font-pixel);font-size:13px;color:var(--gl-c-ink-3);letter-spacing:.18em;text-transform:uppercase}
  .num{font-family:var(--gl-font-pixel);font-size:46px;line-height:1;color:var(--gl-c-ink);font-variant-numeric:tabular-nums;margin-top:6px}
  .num .u{font-size:14px;color:var(--gl-c-ink-3);margin-left:4px}
  .meta{margin-top:6px;display:flex;justify-content:space-between;font-family:var(--gl-font-pixel);font-size:11px;color:var(--gl-c-ink-3)}
  .blocks{display:flex;gap:5px;margin-top:8px}
  .blocks i{width:18px;height:6px;background:var(--gl-c-line-2);border-radius:1px}
  .blocks i.on{background:var(--gl-c-ink)}
</style>
</head>
<body>
<span class="demo-tag">04 · pixel meter</span>
<div class="stage">
  <article class="gl-card">
    <div class="gl-cap">Battery <span class="gl-actions"><span></span></span></div>
    <div class="num">92<span class="u">%</span></div>
    <div class="gl-bars gl-bars--ok" id="bat" style="margin-top:18px;height:14px"></div>
    <div class="meta"><span>charging</span><span>7H 40M</span></div>
  </article>
  <article class="gl-card">
    <div class="gl-cap">Focus blocks <span class="gl-actions"><span></span></span></div>
    <div class="num">9 / 14</div>
    <div class="blocks" id="blocks"></div>
    <div class="meta"><span>deep work</span><span>35 min</span></div>
  </article>
</div>
<script>
  var bat = document.getElementById('bat');
  for(var i=0;i<22;i++){ var x = document.createElement('i'); if(i<20) x.classList.add('is-on'); bat.appendChild(x); }
  var bl = document.getElementById('blocks');
  for(var i=0;i<14;i++){ var x = document.createElement('i'); if(i<9) x.classList.add('on'); bl.appendChild(x); }
</script>
</body>
</html>
