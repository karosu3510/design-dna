<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercury · Component · Hero balance</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:48px}
  .demo-tag{position:absolute;top:18px;left:24px;font-family:var(--mc-font-mono);font-size:11px;color:var(--mc-c-mute);letter-spacing:.06em;text-transform:uppercase}
  .demo{width:520px}
</style>
</head>
<body>
<span class="demo-tag">02 · hero balance</span>
<article class="mc-card demo">
  <div class="mc-row-flex mc-row-flex--between" style="margin-bottom:8px">
    <span class="mc-eyebrow">Total balance <span class="mc-info">i</span></span>
    <span class="mc-status"><span class="mc-dot"></span><b>LIVE</b> · syncing</span>
  </div>
  <div class="mc-display"><span class="mc-cur">$</span>14,245,737<span class="mc-cents">.68</span></div>
  <div class="mc-row-flex" style="margin-top:10px;gap:8px">
    <span class="mc-pill mc-pill--pos">↑ 4.32%</span>
    <span style="font-size:13px;color:var(--mc-c-mute)">vs last 30 days</span>
  </div>
</article>
</body>
</html>
