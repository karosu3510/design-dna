<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Artist of the Month</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1100px;height:720px;overflow:hidden;background:#030303;color:#fff;font-family:"SF Mono","JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,monospace;-webkit-font-smoothing:antialiased}
  body{display:grid;place-items:center;background:#030303}
  .stage{position:relative;width:1100px;height:720px;overflow:hidden;background:#020202}
  canvas{position:absolute;inset:0;width:1100px;height:720px;display:block;background:#020202}
  .grain{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.035) 0 1px,transparent 1.2px);background-size:3px 3px;opacity:.25;mix-blend-mode:screen}
</style>
</head>
<body>
<div class="stage">
  <canvas id="c"></canvas>
  <div class="grain"></div>
</div>
<script>
(function(){
  const W=1100,H=720;
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d',{alpha:false});
  const img=new Image();
  img.src='artist-month-source.webp';
  let ready=false;
  function resize(){const dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  resize();window.addEventListener('resize',resize);
  function coverRect(img,x,y,w,h){const s=Math.max(w/img.naturalWidth,h/img.naturalHeight);const iw=img.naturalWidth*s,ih=img.naturalHeight*s;return{x:x+(w-iw)/2,y:y+(h-ih)/2,w:iw,h:ih}}
  function drawPixelText(t){
    ctx.save();
    ctx.font='30px "SF Mono", "JetBrains Mono", monospace';
    ctx.letterSpacing='1px';
    ctx.textAlign='left';
    ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,255,255,.96)';
    ctx.shadowColor='rgba(255,255,255,.35)';
    ctx.shadowBlur=2;
    const y=376;
    ctx.fillText('ARTIST OF THE MONTH',-45,y);
    ctx.fillText('ARTIST OF THE MONTH',735,y);
    ctx.textAlign='center';
    ctx.fillText('MARCH 2',278,y+31);
    ctx.fillText('MARCH',934,y+31);
    ctx.restore();
  }
  function softenFaceBlock(t){
    const x=420,y=322;
    ctx.save();
    ctx.filter='blur(18px)';
    const g=ctx.createRadialGradient(x,y,20,x,y,182);
    g.addColorStop(0,'rgba(0,8,3,.98)');
    g.addColorStop(.48,'rgba(0,16,7,.88)');
    g.addColorStop(.82,'rgba(0,28,13,.34)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(x+5,y-22,108,156,-.10,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  function drawGreenPlane(t){
    const x=238,y=181,w=604,h=402;
    const r=coverRect(img,x,y,w,h);
    const off=document.createElement('canvas');off.width=w;off.height=h;
    const o=off.getContext('2d');
    o.drawImage(img,r.x-x,r.y-y,r.w,r.h);
    const data=o.getImageData(0,0,w,h);
    const p=data.data;
    for(let yy=0;yy<h;yy++){
      const scan=(yy%4===0)?0.46:(yy%4===1?1.10:.82);
      const jit=Math.sin(yy*.19+t*4.2)*2.2+Math.sin(yy*.047-t*2.1)*5.4;
      for(let xx=0;xx<w;xx++){
        const i=(yy*w+xx)*4;
        const n=((xx*29+yy*53+Math.floor(t*18)*11)%101)/101;
        const lum=(p[i]*.299+p[i+1]*.587+p[i+2]*.114)/255;
        const mask=.72+(n<lum*.72+.10? .28 : -.18);
        const line=scan*(.95+Math.sin(yy*.75+t*5.0)*.05);
        p[i]=Math.max(0,Math.min(255,(2+lum*8)*mask));
        p[i+1]=Math.max(0,Math.min(255,(55+lum*238)*line*mask));
        p[i+2]=Math.max(0,Math.min(255,(24+lum*102)*line*mask));
        p[i+3]=255;
      }
    }
    o.putImageData(data,0,0);
    ctx.save();
    ctx.drawImage(off,x,y,w,h);
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation='screen';
    ctx.globalAlpha=.32;
    for(let yy=y;yy<y+h;yy+=5){
      const offset=Math.sin(yy*.06+t*3.0)*18;
      ctx.fillStyle='rgba(0,255,120,.18)';
      ctx.fillRect(x+offset,yy,w-offset*2,1);
    }
    ctx.restore();
    softenFaceBlock(t);
    ctx.save();
    ctx.strokeStyle='rgba(0,255,120,.18)';
    ctx.lineWidth=1;
    for(let i=0;i<18;i++){
      const yy=y+i*22+(Math.sin(t*2+i)*1.5);
      ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke();
    }
    ctx.restore();
  }
  function render(now){
    const t=now*.001;
    ctx.fillStyle='#020202';ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.globalAlpha=.10;
    const g=ctx.createRadialGradient(W*.5,H*.45,40,W*.5,H*.45,540);
    g.addColorStop(0,'rgba(0,255,120,.26)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.restore();
    drawPixelText(t);
    drawGreenPlane(t);
    drawPixelText(t);
    ctx.save();
    ctx.globalCompositeOperation='destination-over';
    ctx.fillStyle='#020202';ctx.fillRect(0,0,W,H);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha=.18;
    for(let i=0;i<900;i++){
      const x=(i*73+t*59)%W, y=(i*191+t*23)%H;
      ctx.fillStyle=(i%3===0)?'rgba(0,255,120,.18)':'rgba(255,255,255,.10)';
      ctx.fillRect(x,y,1,1);
    }
    ctx.restore();
    requestAnimationFrame(render);
  }
  img.onload=()=>{ready=true;requestAnimationFrame(render)};
})();
</script>
</body>
</html>
