<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Symmetry Breaking Ticket</title>
<style>
  :root{
    --bg:#080808;
    --card:#2b2b2a;
    --card2:#242423;
    --line:rgba(238,235,224,.12);
    --line2:rgba(238,235,224,.18);
    --ink:#e9e5d7;
    --soft:rgba(233,229,215,.70);
    --mute:rgba(233,229,215,.38);
    --faint:rgba(233,229,215,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1100px;height:720px;overflow:hidden;background:var(--bg);font-family:"SF Mono","IBM Plex Mono","JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--ink);-webkit-font-smoothing:antialiased}
  body{display:grid;place-items:center;background:radial-gradient(720px 420px at 48% 48%,rgba(255,255,255,.055),transparent 74%),#070707}
  .wrap{position:relative;width:980px;height:420px;border-radius:18px;background:linear-gradient(180deg,#30302f,#252524);border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 84px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.045);overflow:hidden}
  .wrap::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 13% 20%,rgba(255,255,255,.07),transparent 34%),radial-gradient(circle at 64% 100%,rgba(255,255,255,.045),transparent 42%);pointer-events:none}
  .art{position:absolute;left:0;top:0;width:440px;height:420px;border-right:1px solid var(--line2);overflow:hidden;background:#282827}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .art::before,.art::after{content:none}
  .info{position:absolute;left:440px;right:0;top:0;bottom:0;padding:46px 54px 38px 54px;display:grid;grid-template-rows:auto 1fr auto;gap:28px;background:rgba(0,0,0,.04)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:24px}.kicker{font-size:10px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase}.serial{font-size:11px;color:var(--soft);letter-spacing:.08em}.title{margin-top:12px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:25px;line-height:1;letter-spacing:-.04em;font-weight:600;color:var(--ink)}
  .grid{display:grid;grid-template-columns:1fr 1fr;column-gap:64px;row-gap:21px;align-content:start}.item{min-width:0}.label{font-size:9px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin-bottom:8px}.value{font-size:13px;line-height:1.35;color:var(--soft);letter-spacing:-.035em;white-space:nowrap}.value strong{color:var(--ink);font-weight:500}.rule{grid-column:1/-1;height:1px;background:var(--line);margin:6px 0 0}
  .acts{grid-column:1/-1;display:grid;grid-template-columns:70px 1fr 68px;gap:12px;align-items:center;font-size:12px;color:var(--soft);letter-spacing:-.035em}.acts .no{color:var(--mute)}.acts .time{text-align:right;color:var(--mute)}
  .foot{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-top:18px;font-size:9px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}.stamp{color:var(--soft)}
  .notch{display:none}.perf{position:absolute;left:439px;top:24px;bottom:24px;width:1px;background:repeating-linear-gradient(to bottom,rgba(238,235,224,.19) 0 4px,transparent 4px 10px);z-index:4}
</style>
</head>
<body>
  <main class="wrap" aria-label="Symmetry breaking event ticket">
    <section class="art"><canvas id="halftone" width="440" height="420"></canvas></section>
    <i class="notch n1"></i><i class="notch n2"></i><i class="perf"></i>
    <section class="info">
      <header class="top"><div><div class="kicker">General admission</div><h1 class="title">Symmetry Breaking</h1></div><div class="serial">ID 0029384-A</div></header>
      <div class="grid">
        <div class="item"><div class="label">Type</div><div class="value"><strong>General admission</strong></div></div>
        <div class="item"><div class="label">Access</div><div class="value">All zones</div></div>
        <div class="item"><div class="label">Date</div><div class="value">12.11.2024</div></div>
        <div class="item"><div class="label">Venue</div><div class="value">Kraftwerk sector B</div></div>
        <div class="rule"></div>
        <div class="acts"><span class="no">ACT 01</span><span>Alva Noto</span><span class="time">21:00</span></div>
        <div class="acts"><span class="no">ACT 02</span><span>Ryoichi Kurokawa</span><span class="time">22:20</span></div>
      </div>
      <footer class="foot"><div><span class="stamp">Vol. 04</span> · Valid on entry only</div><div>Row 08 / Seat 24</div></footer>
    </section>
  </main>
<script>
(function(){
  const c=document.getElementById('halftone');
  const ctx=c.getContext('2d');
  const W=c.width,H=c.height;
  const dots='#e7e2d3',bg='#282827';
  const blobs=[
    {x:.20,y:.23,r:.23,a:1.3},{x:.48,y:.18,r:.18,a:.92},{x:.27,y:.58,r:.30,a:1.18},
    {x:.62,y:.45,r:.24,a:1.06},{x:.83,y:.26,r:.18,a:.82},{x:.76,y:.74,r:.28,a:1.05},
    {x:.42,y:.88,r:.20,a:.86},{x:.06,y:.80,r:.16,a:.74}
  ];
  function smooth(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)}
  function hash(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
  function field(nx,ny,t){
    let v=0;
    for(const b of blobs){
      const bx=b.x+Math.sin(t*.00020+b.y*9)*.045+Math.sin(t*.00007+b.x*17)*.018;
      const by=b.y+Math.cos(t*.00017+b.x*7)*.035+Math.cos(t*.00009+b.y*13)*.014;
      const pulse=1+Math.sin(t*.00055+b.x*11+b.y*5)*.11;
      const dx=(nx-bx),dy=(ny-by),d=Math.sqrt(dx*dx+dy*dy)+.018;
      v+=b.a*Math.pow(Math.max(0,(b.r*pulse)/d),1.15);
    }
    v+=.24*Math.sin(nx*13.0+ny*5.0+t*.00055)+.16*Math.cos(ny*16.0-nx*4.0-t*.00042);
    return v;
  }
  function draw(t){
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    const s=9.5,maxR=4.1,minR=.65;
    for(let y=14,row=0;y<H-14;y+=s,row++){
      for(let x=14,col=0;x<W-14;x+=s,col++){
        const nx=x/W,ny=y/H;
        let v=field(nx,ny,t);
        const edge=1-smooth(.82,1.02,Math.abs(nx-.5)*1.18+Math.abs(ny-.5)*.42);
        v*=edge;
        const q=smooth(3.0,6.8,v);
        const shimmer=.5+.5*Math.sin(t*.004+col*.73+row*.31);
        const grain=(hash(col,row)-.5)*.46;
        const r=Math.max(minR, q*maxR + grain + shimmer*.28*q);
        const alpha=.11 + q*(.72+.16*shimmer);
        ctx.fillStyle='rgba(231,226,211,'+alpha.toFixed(3)+')';
        ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
      }
    }
    ctx.fillStyle='rgba(231,226,211,.055)';
    for(let x=0;x<W;x+=34)ctx.fillRect(x,0,1,H);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
