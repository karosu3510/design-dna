<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lucid Drift — Atmospheric Swell</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: #000000;
    --card: #f6dfc7;
    --ink: #2a32d8;
    --pink: #ff35bd;
    --radius: 28px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: "Inter", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh; width:1100px; height:720px;
    display: grid;
    place-items: center;
    padding: 48px 16px; width:1100px; height:720px; overflow:hidden;
  }

  /* === Card === */
  .card {
    position: relative;
    width: min(440px, 100%);
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 14px 18px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,255,255,0.04);
    overflow: hidden;
    isolation: isolate;
  }

  /* === Hero (now a live shader) === */
  .hero {
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: 22px;
    overflow: hidden;
    background: var(--card);
  }

  .hero canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* fade to card color at the bottom */
  .hero::after {
    content: "";
    position: absolute;
    inset: 50% 0 0 0;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(246,223,199,0) 55%,
      rgba(246,223,199,0.85) 88%,
      var(--card) 100%
    );
    pointer-events: none;
    z-index: 1;
  }

  .corner-spark {
    position: absolute;
    top: 14px;
    right: 18px;
    color: #fff;
    opacity: 0.95;
    z-index: 3;
    animation: cornerSparkle 4.2s ease-in-out infinite;
  }
  @keyframes cornerSparkle {
    0%, 100% { opacity: 0.6; transform: scale(1) rotate(0deg); }
    50%      { opacity: 1;   transform: scale(1.15) rotate(45deg); }
  }

  .starburst {
    position: absolute;
    top: 38%;
    left: 50%;
    width: 130px;
    height: 130px;
    transform: translate(-50%, -50%);
    z-index: 3;
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.85));
    animation: starBreath 5.5s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes starBreath {
    0%, 100% { transform: translate(-50%, -50%) scale(1)    rotate(0deg);   opacity: 0.95; }
    50%      { transform: translate(-50%, -50%) scale(1.18) rotate(8deg);   opacity: 1;    }
  }

  /* === Title block === */
  .title-block {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    padding: 18px 8px 0;
  }
  .title {
    font-family: "Instrument Serif", "Times New Roman", serif;
    font-size: 56px;
    line-height: 0.95;
    letter-spacing: -0.01em;
    margin: 0;
    font-weight: 400;
  }
  .title .pink { color: var(--pink); font-style: italic; font-weight: 400; }
  .title .blue { color: var(--ink); }
  .title-line {
    flex: 1;
    height: 1.5px;
    background: var(--ink);
    margin-bottom: 18px;
    transform: translateY(-2px);
  }

  .subtitle {
    font-family: "Instrument Serif", serif;
    font-size: 36px;
    color: var(--ink);
    margin: 4px 8px 0;
    text-align: right;
    font-weight: 400;
    line-height: 1;
  }

  /* === Divider === */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 22px 8px 14px;
    color: var(--ink);
  }
  .divider .dashed {
    flex: 1;
    border-bottom: 1.5px dashed var(--ink);
  }

  /* === Data grid === */
  .grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    padding: 0 8px;
  }
  .cell {
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--ink);
    background: transparent;
    position: relative;
  }
  .cell .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .cell .feels {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: right;
  }
  .cell .feels small {
    display: block;
    font-family: "Instrument Serif", serif;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 0;
    margin-top: 4px;
    text-transform: none;
  }
  .cell .big {
    font-family: "Instrument Serif", serif;
    font-size: 56px;
    line-height: 1;
    font-weight: 400;
    font-feature-settings: "tnum";
  }
  .cell .big sup {
    font-size: 18px;
    vertical-align: super;
    margin-left: 2px;
  }
  .cell .body {
    font-size: 14px;
    line-height: 1.4;
  }

  .cell.span-4 { grid-column: span 4; }
  .cell.span-2 { grid-column: span 2; }

  /* footer chips */
  .chips {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 2fr;
    gap: 8px;
    padding: 0 8px;
    margin-top: 8px;
  }
  .chip {
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .chip.pink { color: var(--pink); border-color: var(--pink); text-align: center; }
  .chip.status { display: flex; align-items: center; gap: 8px; }
  .chip.status::before {
    content: "";
    width: 10px; height: 10px; border-radius: 50%;
    background: #0a0a0a;
    display: inline-block;
  }

  /* reduced motion: stop animations */
  @media (prefers-reduced-motion: reduce) {
    .starburst, .corner-spark { animation: none; }
  }
</style>
</head>
<body>

  <article class="card" aria-label="Lucid Drift weather card">

    <!-- Hero with live shader -->
    <div class="hero" role="img" aria-label="Atmospheric fluid texture">
      <canvas id="fluid"></canvas>

      <!-- corner sparkle -->
      <svg class="corner-spark" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2 L13 11 L22 12 L13 13 L12 22 L11 13 L2 12 L11 11 Z" fill="currentColor"/>
      </svg>

      <!-- center starburst -->
      <svg class="starburst" viewBox="0 0 120 120">
        <g stroke="#fff" stroke-width="1" stroke-linecap="round">
          <line x1="60" y1="6"   x2="60" y2="114" />
          <line x1="6"  y1="60"  x2="114" y2="60" />
          <line x1="22" y1="22"  x2="98"  y2="98" />
          <line x1="98" y1="22"  x2="22"  y2="98" />
          <line x1="40" y1="8"   x2="80"  y2="112" />
          <line x1="80" y1="8"   x2="40"  y2="112" />
          <line x1="8"  y1="40"  x2="112" y2="80" />
          <line x1="8"  y1="80"  x2="112" y2="40" />
        </g>
        <circle cx="60" cy="60" r="3.5" fill="#fff"/>
      </svg>
    </div>

    <!-- Title -->
    <div class="title-block">
      <h1 class="title">
        <span class="pink">Lucid</span> <span class="blue">drift</span>
      </h1>
      <div class="title-line"></div>
    </div>
    <div class="subtitle">Atmospheric swell</div>

    <!-- Divider -->
    <div class="divider">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M12 2 L13 11 L22 12 L13 13 L12 22 L11 13 L2 12 L11 11 Z" fill="currentColor"/>
      </svg>
      <div class="dashed"></div>
    </div>

    <!-- Data grid -->
    <div class="grid">
      <div class="cell span-4">
        <div class="label">Core temp</div>
        <div class="big">74<sup>°F</sup></div>
        <div class="feels">
          Feels like
          <small>76.2°</small>
        </div>
      </div>
      <div class="cell span-2">
        <div class="label">Humidity</div>
        <div class="big">68<sup>%</sup></div>
      </div>
      <div class="cell span-2">
        <div class="label">Wind vec</div>
        <div class="body">
          SW 12kts<br/>
          Gst 18kts
        </div>
      </div>
      <div class="cell span-2">
        <div class="label">Pressure</div>
        <div class="body">
          1012 hPa<br/>
          Rising
        </div>
      </div>
      <div class="cell span-2">
        <div class="label">UV index</div>
        <div class="body">
          4.2 Mod<br/>
          Peak 13:00
        </div>
      </div>
    </div>

    <!-- Footer chips -->
    <div class="chips">
      <div class="chip">Aero</div>
      <div class="chip pink">34.05°N</div>
      <div class="chip">Live</div>
      <div class="chip status">Sys.status</div>
    </div>

  </article>

<script>
