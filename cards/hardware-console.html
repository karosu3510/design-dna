<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Meteorological digital sys — Tokyo console</title>
<style>
  :root{
    --bg:#333436;
    --shell:#171819;
    --shell2:#232426;
    --screen:#070707;
    --orange:#ff5a2a;
    --dim:#55575a;
    --white:#ececea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1100px;height:720px;overflow:hidden;background:var(--bg);font-family:"Space Mono","SFMono-Regular",ui-monospace,Menlo,monospace;-webkit-font-smoothing:antialiased;color:var(--orange)}
  body{display:grid;place-items:center}
  .ambient{position:absolute;inset:0;background:radial-gradient(42% 32% at 52% 55%,rgba(0,0,0,.18),transparent 64%),radial-gradient(58% 42% at 50% 55%,rgba(0,0,0,.28),transparent 76%);pointer-events:none}
  .device{position:relative;width:640px;height:310px;border-radius:24px;background:linear-gradient(145deg,#252628,#141516 74%);box-shadow:0 36px 80px rgba(0,0,0,.42),0 16px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.045),inset 0 -2px 4px rgba(0,0,0,.55);padding:28px 28px 22px;display:grid;grid-template-columns:320px 170px 74px;gap:18px;transform:translateY(18px)}
  .device::after{content:"";position:absolute;left:18px;right:18px;bottom:-12px;height:18px;border-radius:0 0 22px 22px;background:#090909;filter:blur(.2px);opacity:.72;z-index:-1}
  .micro{position:absolute;top:14px;font-size:8px;letter-spacing:.28em;color:rgba(255,255,255,.11);text-transform:uppercase}.micro.l{left:26px}.micro.r{right:120px}.dot{position:absolute;top:28px;right:18px;width:7px;height:7px;border-radius:50%;background:#070707;box-shadow:inset 0 1px 2px rgba(255,255,255,.08)}
  .screen{position:relative;height:210px;border-radius:7px;background:var(--screen);border:1px solid rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(0,0,0,.8),inset 0 0 28px rgba(255,80,25,.09),0 2px 6px rgba(0,0,0,.45);overflow:hidden;margin-top:8px}
  .screen::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,95,35,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,95,35,.052) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.025) 50%,transparent 50%);background-size:20px 20px,20px 20px,100% 3px;opacity:.8}
  .screen::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 80% at 50% 60%,transparent 30%,rgba(0,0,0,.48) 100%);pointer-events:none}
  .meta{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,90,42,.58);z-index:2}
  .wave{position:absolute;left:0;right:0;top:56px;height:86px;z-index:2;filter:drop-shadow(0 0 5px rgba(255,90,42,.85))}
  .temp{position:absolute;left:18px;bottom:55px;font-size:42px;letter-spacing:-.06em;line-height:.9;color:var(--orange);z-index:2;text-shadow:0 0 10px rgba(255,90,42,.36)}
  .state{position:absolute;left:18px;bottom:38px;font-size:10px;letter-spacing:.22em;color:rgba(255,90,42,.45);text-transform:uppercase;z-index:2}.readout{position:absolute;bottom:14px;font-size:10px;letter-spacing:.18em;color:rgba(255,90,42,.62);z-index:2}.readout.wind{left:18px}.readout.precip{right:18px;text-align:right}.readout b{display:block;font-size:20px;letter-spacing:-.03em;color:var(--orange);line-height:1.1}.readout small{font-size:9px;color:rgba(255,90,42,.5)}
  .control{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;margin-top:8px}.knob{position:relative;width:140px;height:140px;border-radius:50%;background:repeating-radial-gradient(circle,#f3f3f0 0 1px,#c7c8c5 1px 2px);box-shadow:inset 0 2px 8px rgba(0,0,0,.25),inset 0 -2px 4px rgba(255,255,255,.18),0 6px 18px rgba(0,0,0,.38),0 0 12px rgba(255,255,255,.22);animation:spin 20s linear infinite}.knob::after{content:"";position:absolute;inset:10px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 3px,rgba(0,0,0,.12) 3px 4px);opacity:.72}.knob .pin{position:absolute;top:17px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--orange);transform:translateX(-50%);box-shadow:0 0 0 3px #080808,0 0 8px rgba(255,90,42,.65);z-index:3}@keyframes spin{to{transform:rotate(360deg)}}
  .label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.23);text-align:center}.buttons{align-self:center;display:grid;gap:8px;padding:0;background:transparent;box-shadow:none}.mode{width:74px;height:48px;border:0;border-radius:6px;background:#232426;color:rgba(255,255,255,.32);font:700 12px ui-monospace,monospace;letter-spacing:.08em;box-shadow:inset 0 1px 0 rgba(255,255,255,.055),inset 0 -2px 4px rgba(0,0,0,.42),0 2px 5px rgba(0,0,0,.22)}.mode.active{color:var(--orange);background:#151617;text-shadow:0 0 8px rgba(255,90,42,.3)}.bottom-etch{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.24em;color:rgba(255,255,255,.09);text-transform:uppercase}
</style>
</head>
<body>
<div class="ambient"></div>
<main class="device" aria-label="Meteorological digital system hardware console">
  <div class="micro l">Meteorological digital sys</div>
  <div class="micro r">No D-06 / Terminal</div>
  <div class="dot"></div>
  <section class="screen">
    <div class="meta"><span>Loc. Tokyo JP</span><span>Mon</span></div>
    <svg class="wave" viewBox="0 0 320 86" preserveAspectRatio="none">
      <path d="M0 46 C42 12 78 50 113 67 S190 72 226 42 S284 24 320 48" fill="none" stroke="#ff5a2a" stroke-width="2.6" stroke-linecap="round">
        <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 46 C42 12 78 50 113 67 S190 72 226 42 S284 24 320 48;M0 52 C48 34 76 16 118 54 S190 76 230 48 S278 22 320 42;M0 46 C42 12 78 50 113 67 S190 72 226 42 S284 24 320 48" />
      </path>
    </svg>
    <div class="temp">22°</div>
    <div class="state">Clear/stable</div>
    <div class="readout wind">Wind<b>14<small>kph</small></b></div>
    <div class="readout precip">Precip<b>0</b></div>
  </section>
  <section class="control">
    <div class="knob"><span class="pin"></span></div>
    <div class="label">Forecast scrubber</div>
  </section>
  <section class="buttons">
    <button class="mode active">TMP</button>
    <button class="mode">RAD</button>
    <button class="mode">SYS</button>
  </section>
  <div class="bottom-etch">Precision data link</div>
</main>
</body>
</html>
