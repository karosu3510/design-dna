<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design DNA — endless designs, just scroll</title>
<!-- 把 cards/all.json 提前到首屏 critical chain：浏览器一拿到 HTML 就开始下载这份 bundle，
     和 templates.js / 内联 script 解析并行，下面 __cardLoader 启动时 fetch 直接 hit 缓存。 -->
<link rel="preload" href="./cards/all.json" as="fetch" type="application/json" crossorigin="anonymous" />
<!-- JSZip 懒加载：仅在用户点击「下载素材包」时按需注入，避免首屏 100KB CDN 阻塞 -->
<script>
  window.__loadJSZip = function(){
    if(typeof JSZip !== 'undefined') return Promise.resolve();
    if(window.__jszipPromise) return window.__jszipPromise;
    window.__jszipPromise = new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
      s.onload = function(){ resolve(); };
      s.onerror = reject;
      document.head.appendChild(s);
    });
    return window.__jszipPromise;
  };
</script>
<style>
  :root{
    --bg:#0a0a0a;--bg-soft:#111;--bg-card:#151515;
    --border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.16);
    --text:#f5f5f5;--text-soft:#a1a1a1;--text-mute:#666;
    --accent:#e8f060;--accent-ink:#111;--radius:14px;
    --side-w:56px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}

  /* ─── 左侧极窄 Sidebar ─── */
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--side-w);background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;z-index:90;gap:4px}
  .side-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%}
  .side-logo{width:30px;height:30px;border-radius:9px;background:#0F0F10;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:6px;border:1px solid rgba(255,255,255,.08);transition:transform .15s ease}
  .side-logo:hover{transform:scale(1.04)}
  .side-tab{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-soft);background:transparent;border:0;transition:all .15s ease;position:relative}
  .side-tab:hover{background:rgba(255,255,255,.05);color:var(--text)}
  .side-tab.active{background:rgba(255,255,255,.08);color:var(--text)}
  .side-tab.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:2px;height:18px;background:var(--accent);border-radius:0 2px 2px 0}
  .side-tip{position:absolute;left:46px;top:50%;transform:translateY(-50%) translateX(-4px);background:#1c1c1c;color:#fff;padding:5px 10px;border-radius:6px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:all .15s ease;border:1px solid var(--border);z-index:80}
  .side-tab:hover .side-tip{opacity:1;transform:translateY(-50%) translateX(0)}
  .side-spacer{flex:1}
  .side-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#E8DFD2,#5E6AD2);margin-top:auto;margin-bottom:8px;position:relative;z-index:100;pointer-events:auto}
  /* 扩大头像点击热区，避免点歪 */
  .side-avatar::after{content:'';position:absolute;inset:-10px;border-radius:50%;z-index:1}

  /* ─── 顶部社区切换已移除 ─── */

  /* ─── 主区瀑布流：CSS Grid masonry（行 8px，按内容高度 span） ─── */
  .stage{margin-left:var(--side-w);padding:8px 8px 120px;min-height:100vh}
  /* 基线 3 列 —— 每行 3 张卡，是默认状态。
     超宽屏升到 6 列基线，常规卡 span 2（仍 3/行），仅"竖屏窄卡"span 1（6/行）。
     窄屏退到 2 列。 */
  .feed{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:8px;gap:8px;grid-auto-flow:dense}
  .feed > .card{grid-column:span 2}
  .card.is-narrow{grid-column:span 1}
  @media (max-width:1680px){
    .feed{grid-template-columns:repeat(3,minmax(0,1fr))}
    .feed > .card,.card.is-narrow{grid-column:span 1}
  }
  @media (max-width:900px){
    .feed{grid-template-columns:repeat(2,minmax(0,1fr))}
    .feed > .card,.card.is-narrow{grid-column:span 1}
  }
  .card{margin:0;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative;cursor:pointer;transition:transform .2s ease,border-color .2s ease;animation:rise .5s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card:hover{border-color:var(--border-strong)}
  .card-frame{width:100%;display:block;border:0;background:#0a0a0a;color-scheme:dark;pointer-events:none}
  .card-preview{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:linear-gradient(180deg,#1a1a1a,#111);color:#fff;pointer-events:none;transition:opacity .25s ease}
  .card-preview.is-hiding{opacity:0}
  .card-preview::before{content:'';position:absolute;inset:12px;border:1px solid rgba(255,255,255,.08);border-radius:8px;pointer-events:none}
  .card-preview-title{font-size:15px;font-weight:600;max-width:80%;line-height:1.35;color:#f5f5f5}
  .card-preview-sub{font-size:11px;color:var(--text-mute)}
  /* dashboard 卡用 transform scale 缩放：iframe 用绝对定位 + 固定逻辑宽 */
  .card.has-scale{position:relative}
  .card.has-scale > .card-frame{position:absolute;top:0;left:0;width:auto}
  /* [REMOVED] .card-meta / .card-title / .icon-btn —— 底部 hover 操作条已并入右上角 .card-actions */
  .card-badge{position:absolute;top:8px;right:8px;display:flex;gap:4px;align-items:center;padding:3px 7px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border-radius:999px;font-size:10px;color:#fff;opacity:0;transition:opacity .2s ease;z-index:3}
  .card:hover .card-badge{opacity:1}

  /* ─── Hover 右上角操作组：收藏 + 点赞 ─── */
  .card-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transform:translateY(-4px);transition:opacity .18s ease, transform .18s ease;pointer-events:none;z-index:5}
  .card:hover .card-actions{opacity:1;transform:none;pointer-events:auto}
  .card:hover .card-badge{opacity:0;pointer-events:none}                       /* hover 时 badge 让位给 actions */
  .card-actions .act{width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .15s ease,border-color .15s ease,color .15s ease,transform .15s ease}
  .card-actions .act:hover{background:rgba(0,0,0,.82);border-color:rgba(255,255,255,.26);transform:translateY(-1px)}
  .card-actions .act svg{width:14px;height:14px;display:block;transition:fill .15s ease}
  .card-actions .act.is-on{background:#fff;border-color:#fff;color:#111}
  .card-actions .act.is-on svg{fill:currentColor}
  @keyframes actPop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
  .card-actions .act.pop svg{animation:actPop .35s ease}

  /* ─── Hover 浮出操作：复制代码 ─── */
  .card-fav{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;background:rgba(0,0,0,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:11px;font-weight:500;color:#fff;cursor:pointer;opacity:0;transform:translateY(-4px);transition:opacity .18s ease, transform .18s ease, background .15s ease;z-index:4;letter-spacing:.01em}
  .card:hover .card-fav{opacity:1;transform:none}
  .card-fav:hover{background:rgba(0,0,0,.82);border-color:rgba(255,255,255,.22)}
  .card-fav svg{width:13px;height:13px;flex-shrink:0;transition:fill .15s ease,stroke .15s ease}
  .card-fav.is-on svg{fill:#fff}
  @keyframes featPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
  .card-fav.pulse{animation:featPulse .6s ease}

  .sentinel{height:60px;display:flex;align-items:center;justify-content:center;color:var(--text-mute);font-size:13px}
  .dot-loader{display:inline-flex;gap:4px}
  .dot-loader span{width:6px;height:6px;border-radius:50%;background:var(--text-mute);animation:bounce 1.2s infinite ease-in-out}
  .dot-loader span:nth-child(2){animation-delay:.15s}
  .dot-loader span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

  /* ─── 底部浮动 Prompt 条 ─── */
  .prompt-dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:55;width:min(640px,calc(100vw - 80px - var(--side-w)));margin-left:calc(var(--side-w) / 2)}
  .prompt-wrap{background:rgba(20,20,20,0.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--border-strong);border-radius:16px;padding:10px 10px 8px;box-shadow:0 16px 48px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.02)}
  .prompt-input{width:100%;background:transparent;border:0;outline:0;color:var(--text);font-size:14px;resize:none;min-height:24px;max-height:120px;padding:6px 8px;font-family:inherit;line-height:1.5}
  .prompt-input::placeholder{color:var(--text-mute)}
  .prompt-bar{display:flex;align-items:center;gap:6px;padding-top:4px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:11.5px;color:var(--text-soft);background:rgba(255,255,255,0.04);border:1px solid var(--border);cursor:pointer;transition:all .15s ease}
  .chip:hover{background:rgba(255,255,255,.08);color:var(--text)}
  .chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .chip-swatch{width:9px;height:9px;border-radius:3px}
  .submit{margin-left:auto;width:30px;height:30px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
  .submit:hover{background:#d9e152}

  /* ─── 左下浮动 chips（视图模式）已移除 ─── */

  /* ─── 右下"生成中"浮卡 ─── */
  .gen-toast{position:fixed;right:14px;bottom:18px;z-index:55;width:240px;padding:12px 14px;background:rgba(15,15,15,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px -8px rgba(0,0,0,.7);transform:translateY(20px);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.4,.2,.2,1)}
  .gen-toast.show{transform:none;opacity:1;pointer-events:auto}
  .gen-toast-row{display:flex;align-items:center;gap:10px}
  .gen-spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin 1s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .gen-title{font-size:12px;font-weight:500;color:var(--text);flex:1;min-width:0}
  .gen-sub{font-size:10.5px;color:var(--text-mute);margin-top:2px}
  .gen-close{width:20px;height:20px;border-radius:6px;border:0;background:transparent;color:var(--text-mute);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .gen-close:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .gen-bar{height:2px;background:var(--border);border-radius:99px;margin-top:10px;overflow:hidden}
  .gen-bar-fill{height:100%;background:var(--accent);width:30%;animation:slide 1.4s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}

  /* ─── Detail（整页 · 参考 Variant：面包屑返回） ─── */
  .detail-view{position:fixed;inset:0;left:var(--side-w);background:var(--bg);z-index:70;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .22s ease, transform .22s ease}
  .detail-view.open{opacity:1;pointer-events:auto;transform:none}
  body.is-detail{overflow:hidden}
  /* 进入详情时，隐藏主 feed 附属 UI，避免穿透 */
  body.is-detail .prompt-dock,
  body.is-detail .gen-toast,
  body.is-detail .saved-panel,
  body.is-detail .style-drawer{opacity:0;pointer-events:none;transition:opacity .15s ease}

  .detail-top{height:52px;flex-shrink:0;padding:0 24px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:2}
  .crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-soft);min-width:0}
  .crumb-link{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;color:var(--text-soft);background:transparent;border:0;cursor:pointer;font:inherit;transition:background .15s ease, color .15s ease}
  .crumb-link:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .crumb-sep{color:var(--text-mute);font-size:12px;user-select:none}
  .crumb-current{color:var(--text);font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
  .detail-top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
  .detail-sref{font-size:11.5px;color:var(--text-mute);margin-right:6px;font-variant-numeric:tabular-nums}

  .detail-body{flex:1;overflow:auto;padding:20px 32px 40px;display:flex;justify-content:center}
  .detail-stage{width:min(1600px,100%);display:flex;flex-direction:column;gap:14px}
  .detail-frame-wrap{border-radius:14px;overflow:hidden;background:transparent}
  .detail-frame{width:100%;border:0;background:transparent;display:block}
  .detail-meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 2px;font-size:12.5px;color:var(--text-soft)}
  .detail-meta-row .dot{width:3px;height:3px;border-radius:50%;background:var(--text-mute)}

  .drawer-sub{font-size:12px;color:var(--text-mute)}
  .btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:500;border:1px solid var(--border-strong);background:transparent;color:var(--text);transition:background .15s ease}
  .btn:hover{background:rgba(255,255,255,0.04)}
  .btn-icon{width:32px;padding:0;justify-content:center}

  /* ─── Saved Panel ─── */
  .saved-panel{position:fixed;left:calc(var(--side-w) + 8px);top:50px;width:280px;max-height:60vh;overflow:auto;background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:12px;z-index:60;opacity:0;pointer-events:none;transform:translateY(-8px);transition:all .2s ease}
  .saved-panel.open{opacity:1;pointer-events:auto;transform:none}
  .saved-panel h3{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--text-soft)}
  .saved-item{display:flex;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
  .saved-item:hover{background:rgba(255,255,255,.04)}
  .saved-thumb{width:44px;height:44px;border-radius:8px;background:#fff;flex-shrink:0;overflow:hidden}
  .saved-thumb iframe{width:220px;height:220px;border:0;transform:scale(.2);transform-origin:top left;pointer-events:none}
  .saved-meta{font-size:12px;color:var(--text-soft);line-height:1.4;overflow:hidden}
  .saved-empty{color:var(--text-mute);font-size:12px;text-align:center;padding:18px 0}

  /* ─── Style Drawer（左侧 sidebar 展开） ─── */
  .style-drawer{position:fixed;left:var(--side-w);top:0;bottom:0;width:280px;background:var(--bg-soft);border-right:1px solid var(--border);z-index:55;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,.2,.2,1);display:flex;flex-direction:column;padding:16px 14px}
  .style-drawer.open{transform:none}
  .style-drawer h3{margin:6px 4px 12px;font-size:12px;color:var(--text-soft);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
  .style-list{display:flex;flex-direction:column;gap:4px}
  .style-list .chip{justify-content:flex-start;height:34px;width:100%;font-size:13px;padding:0 12px;border-radius:8px}

  /* ─── 头像（可点击） ─── */
  .side-avatar{cursor:pointer;transition:transform .15s ease, box-shadow .15s ease}
  .side-avatar:hover{transform:scale(1.06);box-shadow:0 0 0 2px rgba(255,255,255,.12)}
  .side-avatar.signed{background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:12px;font-weight:600;letter-spacing:.02em}

  /* ─── 登录 Modal ─── */
  .auth-mask{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;animation:fadeIn .18s ease}
  .auth-mask.open{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .auth-card{width:380px;background:#0f0f0f;border:1px solid var(--border);border-radius:16px;padding:32px 28px 26px;box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pop .22s cubic-bezier(.4,.2,.2,1)}
  .auth-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .auth-close:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .auth-card{position:relative}
  .auth-logo{width:42px;height:42px;border-radius:10px;background:var(--accent);color:#000;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px}
  .auth-title{text-align:center;font-size:18px;font-weight:600;color:var(--text);margin-bottom:6px}
  .auth-sub{text-align:center;font-size:13px;color:var(--text-soft);margin-bottom:22px}
  .auth-btn{width:100%;height:42px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:all .15s ease;margin-bottom:8px}
  .auth-btn:hover{background:rgba(255,255,255,.08);border-color:var(--border-strong)}
  .auth-btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
  .auth-btn.primary:hover{background:#f5e896}
  .auth-btn:disabled{opacity:.5;cursor:not-allowed}
  .auth-divider{display:flex;align-items:center;gap:10px;color:var(--text-soft);font-size:11px;margin:14px 0;text-transform:uppercase;letter-spacing:.06em}
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .auth-input{width:100%;height:42px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);font-size:14px;padding:0 14px;outline:none;transition:border-color .15s ease;margin-bottom:10px;font-family:inherit}
  .auth-input:focus{border-color:var(--accent)}
  .auth-foot{text-align:center;font-size:12px;color:var(--text-soft);margin-top:14px;line-height:1.6}
  .auth-foot a{color:var(--text);text-decoration:underline;cursor:pointer}
  .auth-back{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-soft);background:transparent;border:0;cursor:pointer;margin-bottom:10px;padding:0}
  .auth-back:hover{color:var(--text)}
  .auth-otp{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}
  .auth-otp input{width:42px;height:48px;text-align:center;font-size:18px;font-weight:600;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);outline:none;font-family:inherit}
  .auth-otp input:focus{border-color:var(--accent)}
  .auth-step{display:none}
  .auth-step.show{display:block}
  .auth-msg{font-size:12px;color:var(--text-soft);text-align:center;margin-bottom:10px}
  .auth-msg.error{color:#ff6b6b}

  /* ─── 头像气泡菜单 ─── */
  .user-pop{position:fixed;left:calc(var(--side-w) + 8px);bottom:14px;width:220px;background:#0f0f0f;border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.5);padding:6px;z-index:150;display:none;animation:pop .18s cubic-bezier(.4,.2,.2,1)}

<!--
  Tier 1 manifest 化（2026-05-16）：原本这里有 33 个同步 <script src="*-doc.js">
  共 ~534KB JS 在首屏 parse 阶段阻塞，把 TTFB→Interactive 拖到 1.5-3s。
  现在改为：
    1) build 时把所有 _DOC 字符串提取到 cards/<slug>.html（参见 tools/build-cards.cjs）
    2) 启动时只 fetch ~3KB 的 cards/manifest.json
    3) iframe 真正进入视口才 fetch 单个卡片 HTML 注入 srcdoc
  产品定义不变：所有动态预览仍然同时存在并在视口内动起来；离屏卡片继续走
  pause/resume 节流。下方 __cardLoader 是这个机制的全部前端代码。
-->
<script>
window.__cardLoader = (function(){
  // KEY → slug（启动时 fetch manifest.json 填充）
  var keyToSlug = Object.create(null);
  // KEY → Promise<html>（in-flight + 已完成的 fetch 结果缓存，避免重复请求）
  var pending = Object.create(null);
  // KEY → html string（小卡命中后直接同步返回）
  var cache = Object.create(null);

  // ─── 启动策略：一次性 fetch cards/all.json bundle 把全部 33 张卡 HTML 装进 cache ───
  // 30+ 个独立 fetch 在 HTTP/1.1 上会被并发限制（6）卡成串行队列；
  // 一次 bundle (gzip ~120KB) 一个连接拿完，节省 32 次握手 + 排队。
  // bundle 走 force-cache，浏览器 / GH Pages CDN 会复用。
  var bundlePromise = fetch('./cards/all.json', { cache:'force-cache' })
    .then(function(r){ if(!r.ok) throw new Error('bundle http '+r.status); return r.json(); })
    .then(function(j){
      // 一次性塞 cache，所有 ensureDoc 立刻命中
      Object.keys(j || {}).forEach(function(k){ cache[k] = j[k]; });
      return cache;
    })
    .catch(function(err){
      console.warn('[cardLoader] bundle failed, will fall back to per-card fetch:', err);
      return null;
    });

  // manifest 仍然保留，作为 bundle 失败时的单卡 fallback 路径
  var manifestPromise = fetch('./cards/manifest.json', { cache:'force-cache' })
    .then(function(r){ if(!r.ok) throw new Error('manifest http '+r.status); return r.json(); })
    .then(function(j){ keyToSlug = (j && j.keys) || {}; return keyToSlug; })
    .catch(function(err){ console.error('[cardLoader] manifest failed:', err); return {}; });

  // LAZY 标记：在 design.doc 字段里以字符串形式占位，drainFrameQueue 在
  // 注入 iframe 之前会识别并 await ensureDoc(key) 拿到真实 HTML。
  var LAZY_PREFIX = '__LAZY__:';
  function lazy(key){ return LAZY_PREFIX + key; }
  function isLazy(v){ return typeof v === 'string' && v.indexOf(LAZY_PREFIX) === 0; }
  function keyOf(v){ return isLazy(v) ? v.slice(LAZY_PREFIX.length) : null; }

  // 拉取单张卡片 HTML：优先等 bundle（一次拿完所有）；bundle 没回来时也不立即
  // 启动单卡 fetch（避免重复网络），让调用方在 bundle resolve 后再消费。
  // bundle 失败的兜底路径走 manifest + 单卡 fetch。
  function ensureDoc(key){
    if(cache[key]) return Promise.resolve(cache[key]);
    if(pending[key]) return pending[key];
    pending[key] = bundlePromise.then(function(bundle){
      if(cache[key]) return cache[key];        // bundle 成功 → 已经塞进来了
      if(bundle){ console.warn('[cardLoader] key not in bundle:', key); }
      // bundle 失败 / key 缺失 → 走单卡 fallback
      return manifestPromise.then(function(){
        var slug = keyToSlug[key];
        if(!slug){ console.warn('[cardLoader] unknown key:', key); return ''; }
        return fetch('./cards/' + slug + '.html', { cache:'force-cache' })
          .then(function(r){ if(!r.ok) throw new Error('card http '+r.status+' '+slug); return r.text(); })
          .then(function(txt){ cache[key] = txt; return txt; })
          .catch(function(err){ console.error('[cardLoader] fetch card failed:', key, err); return ''; });
      });
    }).then(function(html){ delete pending[key]; return html; });
    return pending[key];
  }

  // 同步取已加载的（用于 export / saved 场景，能拿就拿）
  function getCached(key){ return cache[key] || ''; }

  return { lazy:lazy, isLazy:isLazy, keyOf:keyOf, ensureDoc:ensureDoc, getCached:getCached };
})();

// 兼容旧调用：把 lazy 标记 → 真实 HTML（异步）。如果传入的本身就是 HTML 字面量，
// 同步返回；如果是 lazy 标记，返回 Promise<string>。调用方用 Promise.resolve 包裹即可统一处理。
window.resolveDoc = function(doc){
  var L = window.__cardLoader;
  if(!L) return doc || '';
  if(L.isLazy(doc)) return L.ensureDoc(L.keyOf(doc));
  return doc || '';
};
</script>
<script>
const STYLES = window.VARIANT_STYLES;
const TEMPLATES = window.VARIANT_TEMPLATES;

function parsePrompt(raw){
  const s=(raw||'').trim() || 'A beautiful product';
  let headline = s.split(/[。.！!?？\n]/)[0].trim();
  if(headline.length>40) headline = headline.slice(0,38)+'…';
  const rest = s.slice(headline.length).replace(/^[。.！!?？\s]+/,'');
  const sub = rest || 'Built to feel good and work hard.';
  return { headline, sub, raw:s };
}

let idCounter = 1;
function generateBatch(promptRaw, forcedStyle, n=8, opts){
  const p = parsePrompt(promptRaw);
  const out = [];
  const used = new Set();
  const isFirstBatch = !!(opts && opts.firstBatch);
  // 已出现过的 styleLock 集合：同一个 styleLock 在 feed 中只允许出现一次
  const excludeLocks = new Set((opts && opts.excludeStyleLocks) || []);
  // 不规则高度：让卡片像 Variant 那样高低错落
  const heightPool = [320, 380, 420, 480, 520, 560, 620, 720];
  // 索引：哪些模板有 styleLock（必须搭配特定 style），哪些没有（通用）
  const lockedIdx = [];
  const freeIdx = [];
  TEMPLATES.forEach((fn,i)=>{
    try{ const probe = fn({headline:'probe'}, STYLES[0].tokens); if(probe && probe.styleLock) lockedIdx.push({i, lock:probe.styleLock}); else freeIdx.push(i); }
    catch(e){ freeIdx.push(i); }
  });
  // 找 nothing 精选模板索引
  const featuredIdx = lockedIdx.find(x=>x.lock==='nothing');
  for(let i=0;i<n;i++){
    let style = forcedStyle || STYLES[Math.floor(Math.random()*STYLES.length)];
    let tplIdx; let tries=0;
    let isFeatured = false;
    // 第一批的第 0 张：强制用 nothing 精选卡（除非已被 pin 排除）
    if(isFirstBatch && i===0 && featuredIdx && !excludeLocks.has('nothing')){
      tplIdx = featuredIdx.i;
      isFeatured = true;
    } else if(isFirstBatch && i===1){
      // 第一批第 2 张：强制用 marginalia 卡（index 5）
      tplIdx = 5;
    } else {
      // 如果当前 style 有专属模板，30% 概率优先抽 locked 的（前提是该 lock 未在 feed 中出现过）
      const matched = lockedIdx.filter(x=>x.lock===style.id && !excludeLocks.has(x.lock));
      if(matched.length && Math.random()<0.3 && !used.has(matched[0].i)){
        tplIdx = matched[0].i;
      } else {
        do { tplIdx = freeIdx[Math.floor(Math.random()*freeIdx.length)]; tries++ } while (used.has(tplIdx) && tries<freeIdx.length*2);
      }
    }
    used.add(tplIdx);
    if(used.size>=TEMPLATES.length) used.clear();
    const design = TEMPLATES[tplIdx](p, style.tokens);
    // 如果模板锁定了 style，强制切换
    if(design.styleLock){
      // 跳过：该 styleLock 在 feed 中已经出现过
      if(excludeLocks.has(design.styleLock)){
        i--; // 重新来过这一轮
        continue;
      }
      excludeLocks.add(design.styleLock); // 后续同批次也不再出现
      const locked = STYLES.find(s=>s.id===design.styleLock);
      if(locked) style = locked;
    }
    // 覆盖原模板高度，但 styleLock 的模板保留自身高度（dashboard 不能压缩）
    if(!design.styleLock){
      design.height = heightPool[Math.floor(Math.random()*heightPool.length)];
    }
    out.push({
      id: 'd' + (idCounter++).toString(36).padStart(4,'0'),
      styleId: style.id, styleLabel: style.label,
      sref: style.id + '-' + Math.random().toString(36).slice(2,7),
      prompt: p.raw, featured: isFeatured, ...design
    });
  }
  return out;
}

const lazyFrames = new Set();

// ─── iframe 加载并发限流 ───
// 设计要点（2026-05-16 第二轮修复）：
//   * 限流只控制「同时写 srcdoc」的瞬间，不卡 fetch。
//   * fetch 走 __cardLoader.ensureDoc()，启动时已并行 prefetch 全部卡片，
//     所以 drainFrameQueue 时 cache 通常已命中，写 srcdoc 立刻就发生。
//   * 进队列前先把 lazy 标记解开成真实 HTML，未解开的（fetch 在飞）就不占槽位
//     先放回队尾等下一轮 → 这样 fetch 慢的卡不会卡住后面的卡。
//
// 参数演化（karo 实测）：
//   v1: PARALLEL=3, TIMEOUT=3500ms — 30 张卡最坏 35s 排队
//   v2: PARALLEL=5, TIMEOUT=2200ms — Tier 1 manifest 化前的上限
//   v3: PARALLEL=8, TIMEOUT=1500ms — fetch 移出限流后可以更激进，因为槽位
//       占用时长 = 写 srcdoc 到 iframe 'load'，不再包含网络往返。
const FRAME_LOAD_PARALLEL = 8;
const FRAME_LOAD_TIMEOUT_MS = 1500;
let frameLoadingNow = 0;
const frameLoadQueue = [];
function _drainFrameQueue(){
  while(frameLoadingNow < FRAME_LOAD_PARALLEL && frameLoadQueue.length){
    const frame = frameLoadQueue.shift();
    if(!frame || frame.__loaded) continue;

    // ─── 进槽位前先确保 HTML 已就绪 ───
    var loader = window.__cardLoader;
    var rawDoc = frame.__doc || '';
    var pauseScript = frame.__pauseScript || '';
    var html = rawDoc;
    if(loader && loader.isLazy(rawDoc)){
      var key = loader.keyOf(rawDoc);
      var hit = loader.getCached(key);
      if(hit){
        html = hit;
      } else {
        // fetch 还没回来 → 异步触发 ensureDoc，回来后重新入队，让出本轮槽位
        // 给已就绪的卡。这是关键修复：不让 fetch 占槽位。
        if(!frame.__fetching){
          frame.__fetching = true;
          loader.ensureDoc(key).then(function(){
            frame.__fetching = false;
            // 拿到 HTML 后回到队首（视觉上更连贯）
            frameLoadQueue.unshift(frame);
            _drainFrameQueue();
          });
        }
        continue; // 不递增 frameLoadingNow，本帧让位给下一张
      }
    }

    // ─── 进槽位写 srcdoc ───
    frameLoadingNow++;
    let __released = false;
    const finish = ()=>{
      if(__released) return;
      __released = true;
      frameLoadingNow = Math.max(0, frameLoadingNow - 1);
      frame.removeEventListener('load', finish);
      _drainFrameQueue();
    };
    frame.addEventListener('load', finish, { once: true });
    setTimeout(finish, FRAME_LOAD_TIMEOUT_MS);

    var withPause = pauseScript ? html.replace(/<\/head>/i, pauseScript + '</head>') : html;
    try{ frame.srcdoc = withPause; }catch(_){ finish(); continue; }
    frame.__loaded = true;
    // 重资源卡的 'load' 可能 5-30s 才 fire（要等所有子资源），1200ms 后无条件
    // 淡出 overlay；fetch 已经预热，写 srcdoc 当帧就开始 paint，不会闪白。
    setTimeout(function(){ _hideCardPreview(frame); }, 1200);
  }
}
// 幂等淡出 preview 占位层。多入口调用安全（load 事件 + drain 队列兜底定时器）。
function _hideCardPreview(frame){
  if(!frame || !frame.__preview) return;
  var p = frame.__preview;
  if(p.__hiding) return;
  p.__hiding = true;
  p.classList.add('is-hiding');
  setTimeout(function(){ if(p && p.parentNode) p.style.display = 'none'; }, 280);
}
function loadLazyFrame(frame){
  if(!frame || frame.__loaded || frame.__queued) return;
  frame.__queued = true;
  frameLoadQueue.push(frame);
  _drainFrameQueue();
}
function pauseFrame(frame){
  if(!frame || !frame.__loaded) return;
  try{ frame.contentWindow.postMessage({type:'pause'},'*'); }catch(_){}
}
function resumeFrame(frame){
  if(!frame || !frame.__loaded) return;
  try{ frame.contentWindow.postMessage({type:'resume'},'*'); }catch(_){}
}
const cardFrameObserver = ('IntersectionObserver' in window) ? new IntersectionObserver((entries)=>{
  entries.forEach(en=>{
    const frame = en.target;
    if(en.isIntersecting){
      if(!frame.__loaded) loadLazyFrame(frame);
      resumeFrame(frame);
    } else {
      pauseFrame(frame);
    }
  });
},{ rootMargin:'80px 0px 80px 0px' }) : null;
function observeCardFrame(frame){
  lazyFrames.add(frame);
  if(cardFrameObserver) cardFrameObserver.observe(frame);
  else loadLazyFrame(frame);
}

function buildStyleChips(){

    b.onclick = ()=>{

function makeCardEl(d){

  const isDashboard = !!d.styleLock;

  // stub srcdoc。之前 stub 触发的额外 load 事件会和 _drainFrameQueue 的

  if(window.__cardLoader && window.__cardLoader.isLazy(frame.__doc)){

  const preview = document.createElement('div');
  preview.className = 'card-preview';
  preview.innerHTML = '<div class="card-preview-title">'+(d.title||'Design preview')+'</div><div class="card-preview-sub">加载中...</div>';

  function applyRowSpan(){

  const KIT_AVAILABLE = new Set(['a-record','nothing','retro-ascii','mercury']);

    fav.addEventListener('click',(e)=>{

  }

  // ─── Hover 右上角操作组：收藏 + 点赞（参考 Variant） ───
  {
    const actions = document.createElement('div');
    actions.className = 'card-actions';

    // 收藏（书签）
    const saved = savedMap.has(d.id);
    const saveBtn = document.createElement('button');

    // 点赞（心形）
    const liked = likedMap.has(d.id);
    const likeBtn = document.createElement('button');
    likeBtn.type='button';
    likeBtn.className='act act-like' + (liked ? ' is-on' : '');

    likeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="'+(liked?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
    likeBtn.addEventListener('click',(e)=>{
      e.stopPropagation();
      toggleLikeAction(d, likeBtn);
    });
    actions.appendChild(likeBtn);

    card.appendChild(actions);
  }

  // 单击卡片主体 → 进入详情页（参考 Variant）
  // 子按钮已通过 e.stopPropagation() 阻止冒泡，不受影响
  card.addEventListener('click',()=>openDetail(d));
  // 双击兜底（兼容旧交互习惯）
  card.addEventListener('dblclick',()=>openDetail(d));

  return card;
}

function appendDesigns(list){
  // ★ 硬性约束：feed 中同一个 styleLock 只允许出现一次
  //   这是最后一道闸门，无论卡片来自系统 pin / 用户精选 / 随机批次 / AI 批次，
  //   只要 styleLock 在 feed 中已存在，就直接丢弃。
  const seenLocks = new Set();
  designStore.forEach(d => { if(d && d.styleLock) seenLocks.add(d.styleLock); });
  const filtered = [];
  list.forEach(d => {
    if(!d) return;
    if(d.styleLock){
      if(seenLocks.has(d.styleLock)) return;   // 丢弃重复 dashboard
      seenLocks.add(d.styleLock);
    }
    filtered.push(d);
  });
  const frag = document.createDocumentFragment();
  filtered.forEach(d=>{ designStore.set(d.id,d); frag.appendChild(makeCardEl(d)); });
  feedEl.appendChild(frag);
  reorderFeed();
}

function openDetail(d, opts){
  currentDesign = d;

  document.getElementById('dSub').textContent = (d.styleLabel ? d.styleLabel + ' · ' : '') + '--sref ' + (d.sref||'—');

  if(idEl) idEl.textContent = '#' + d.id;
  const pEl = document.getElementById('dPrompt');
  if(pEl) pEl.textContent = d.prompt || '—';
  // If card has an external URL, navigate directly instead of iframe
  if(d.externalUrl){
    window.location.href = d.externalUrl;
    return;
  }
  const frame = document.getElementById('dFrame');
  frame.setAttribute('sandbox','allow-scripts allow-same-origin');
  // 详情页尽量把 iframe 撑大：基于视口高度动态算，最少 72vh，最多 92vh
  const vh = window.innerHeight || 900;
  const targetH = Math.min(Math.max((d.height||720) + 40, Math.round(vh * 0.72)), Math.round(vh * 0.92));
  frame.style.height = targetH + 'px';
    frame.removeAttribute('src');
    // iframe 内部 html/body 默认白底 → 透出纯黑宿主，去掉 dashboard 外圈白细线
    const reset = '<style>html,body{background:transparent !important;margin:0;padding:0}</style>';
    // Tier 1：d.doc 可能是 lazy 标记，统一走 resolveDoc 拿到 HTML
    Promise.resolve(resolveDoc(d.doc)).then(function(html){
      frame.srcdoc = reset + (html || '');
    });
  detailView.classList.add('open');
  detailView.setAttribute('aria-hidden','false');
  document.body.classList.add('is-detail');
  // 滚回顶，保证面包屑可见
  const body = detailView.querySelector('.detail-body');
  if(body) body.scrollTop = 0;
  // URL hash 同步（支持浏览器后退）
  if(!opts || !opts.skipHash){
    try{ history.pushState({detail:d.id}, '', '#d/'+d.id); }catch(e){}
  }
}

  detailView.classList.remove('open');

  if(!opts || !opts.skipHash){
    if(location.hash.startsWith('#d/')){
      try{ history.pushState({}, '', location.pathname + location.search); }catch(e){}
    }
  }
}

async function copyCardCode(d, btn){
  let code = '';
  let label = '';
  try{
    if(d.externalUrl){
      // 优先获取外链独立页源码（如 carrot-tech.html）
      const res = await fetch(d.externalUrl, {cache:'no-cache'});
      if(res.ok){
        code = await res.text();
        label = d.externalUrl;
      }
    }
    if(!code && d.doc){
      // 回退到 srcdoc 字符串（Tier 1：lazy 标记会被 resolveDoc 解析为真实 HTML）
      const resolved = await Promise.resolve(resolveDoc(d.doc));
      code = String(resolved || '');
      label = d.id + ' (srcdoc)';
    }
    if(!code){ throw new Error('no source'); }

    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(code);
    } else {
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    // 视觉反馈
    if(btn){
      btn.classList.add('pulse');
      const span = btn.querySelector('span');
      const old = span ? span.textContent : '';
      if(span) span.textContent = '已复制';
      setTimeout(()=>{
        btn.classList.remove('pulse');
        if(span) span.textContent = old || '复制代码';
      }, 1100);
    }
    if(typeof flash === 'function'){ flash('已复制 · ' + label); }
  }catch(err){
    console.warn('copyCardCode failed:', err);
    if(typeof flash === 'function'){ flash('复制失败'); }
  }
}

// ─── 下载卡片素材包（HTML + Design System zip） ───
// 保留：当用户在 kit 文档页内一键下载时使用同一份打包逻辑（也保留以备未来恢复 hover 入口）。
// 约定：如果项目存在 kits/<cardId>/，则一并打包；否则回退到只打 HTML
async function downloadCardKit(d, btn){
  // 卡片 slug：优先 styleLock，退化到 id 去掉 'd-' 前缀。
  const slug = d.styleLock || (d.id||'').replace(/^d-/, '') || 'card';
  const setLoading = (on)=>{
    if(!btn) return;
    const span = btn.querySelector('span');
    btn.dataset.busy = on ? '1' : '';
    if(span) span.textContent = on ? '打包中…' : '下载素材包';
  };

  try{
    setLoading(true);
    if(typeof JSZip === 'undefined' && typeof window.__loadJSZip === 'function'){
      await window.__loadJSZip();
    }
    if(typeof JSZip === 'undefined') throw new Error('JSZip not loaded');

    const zip = new JSZip();
    const folder = zip.folder(slug + '-kit');

    // ① 卡片 HTML：优先 externalUrl，回退 srcdoc
    let html = '';
    if(d.externalUrl){
      try{
        const r = await fetch(d.externalUrl, {cache:'no-cache'});
        if(r.ok) html = await r.text();
      }catch(_){}
    }
    if(!html && d.doc){
      // Tier 1：lazy 标记走 resolveDoc 拉取
      const resolved = await Promise.resolve(resolveDoc(d.doc));
      html = String(resolved || '');
    }

    // ② 探测 kits/<slug>/ 目录是否存在 design-system 文件
    const kitBase = './kits/' + slug + '/';
    // 完整文件清单：核心文档 + AI 提示 + Tailwind preset + 8 个 component + 2 个 example + 入口可视化页
    const kitFiles = [
      'README.md','design-system.md','design-system.css','design-tokens.json',
      'ai-prompt.md','tailwind-tokens.js','index.html',
      'components/01-shell.html','components/02-pill.html','components/03-glass-panel.html',
      'components/04-status-dot.html','components/05-mono-display.html','components/06-meter-ring.html',
      'components/07-spectrum-bars.html','components/08-cap-label.html',
      'examples/original.html','examples/settings-page.html'
    ];
    const fetched = {};
    let hasKit = false;
    let hasKitIndex = false;
    await Promise.all(kitFiles.map(async (f)=>{
      try{
        const r = await fetch(kitBase + f, {cache:'no-cache'});
        if(!r.ok) return;
        const txt = await r.text();
        // GitHub Pages 404 fallback 是 HTML 文档；非 HTML 文件若拿到 <!DOCTYPE html> 就视作 404
        const looksLike404 = /^\s*<!DOCTYPE html/i.test(txt) && !f.endsWith('.html') && !f.endsWith('.md');
        if(looksLike404) return;
        fetched[f] = txt;
        hasKit = true;
        if(f === 'index.html') hasKitIndex = true;
      }catch(_){}
    }));

    // ③ 注入文件
    //    - 若 kit 自带 index.html（可视化设计系统文档页），把卡片 HTML 改名 card.html，
    //      让用户解压后默认看到 kit 文档而非原 1100×720 卡片
    //    - 若 kit 没有 index.html，则卡片 HTML 仍命名 index.html
    if(hasKit){
      Object.entries(fetched).forEach(([name, txt])=>{
        folder.file(name, txt);
      });
      if(html){
        folder.file(hasKitIndex ? 'card.html' : 'index.html', html);
      }
    } else if(html){
      folder.file('index.html', html);
      // 回退 README
      const fallback = [
        '# ' + (d.title || slug) + ' · Inspiration Card',
        '',
        'Source: Design DNA inspiration library',
        'Card id: `' + d.id + '`',
        '',
        '> Design system file not yet authored for this card.',
        '> The HTML in `index.html` is self-contained; styles live inline.',
        '',
        'Origin: ' + (d.externalUrl || '(srcdoc)'),
      ].join('\n');
      folder.file('README.md', fallback);
    }

    // ④ 生成 blob 并触发下载
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = slug + '-kit.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1500);

    setLoading(false);
    if(btn){
      btn.classList.add('pulse');
      const span = btn.querySelector('span');
      if(span) span.textContent = '已下载';
      setTimeout(()=>{
        btn.classList.remove('pulse');
        if(span) span.textContent = '下载素材包';
      }, 1100);
    }
    if(typeof flash === 'function'){
      flash(hasKit ? ('已下载 · ' + slug + '-kit.zip') : ('已下载（无 design system）· ' + slug + '-kit.zip'));
    }
  }catch(err){
    console.warn('downloadCardKit failed:', err);
    setLoading(false);
    if(typeof flash === 'function'){ flash('下载失败：' + (err.message||err)); }
  }
}

// ─── 全量重排：精选区（按 ts 倒序） + 非精选区（保持原顺序） ───
function reorderFeed(){
  if(!feedEl) return;
  const cards = Array.from(feedEl.children).filter(el => el.classList && el.classList.contains('card'));
  if(!cards.length) return;
  const featured = [];
  const others = [];
  cards.forEach(el=>{
    const id = el.getAttribute('data-id');
    if(id && featuredMap.has(id)){
      const ts = (featuredMap.get(id) && featuredMap.get(id).ts) || 0;
      featured.push({ el, ts });
    } else {
      others.push(el);
    }
  });
  // 精选区：按 ts 倒序（最新精选的在最上）
  featured.sort((a,b)=>b.ts - a.ts);
  const frag = document.createDocumentFragment();

function renderSavedPanel(){

  [...savedMap.values()].reverse().forEach(item=>{

      '<div class="saved-meta"><div style="color:#fff">'+item.title+'</div><div>'+item.styleLabel+'</div></div>';

function toggleSavedPanel(force){
  const p = document.getElementById('savedPanel');
  const willOpen = force!==undefined ? force : !p.classList.contains('open');
  p.classList.toggle('open', willOpen);
  if(willOpen){
    setSideTab('saved');
    if(styleDrawer) styleDrawer.classList.remove('open');
  } else if(!styleDrawer || !styleDrawer.classList.contains('open')) {
    setSideTab('library');
  }
}

function showGenToast(prompt, n){

  const styleLabel = currentStyle ? currentStyle.label : tr('autoMix');
  genTitle.textContent = tr('generating').replace('{n}', n);

  genToast.classList.add('show');
}

function flash(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:500;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:rise .2s ease';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1400);
}

async function generateBatchAI(promptRaw, n){
  const r = await fetch('/api/generate', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ prompt: promptRaw, n })
  });
  if(!r.ok){ const t = await r.text(); throw new Error('AI '+r.status+': '+t.slice(0,200)); }
  const j = await r.json();
  return j.designs.map((d)=>({
    id: 'ai' + (idCounter++).toString(36).padStart(4,'0'),
    title: d.title || 'Untitled',
    height: Math.max(280, Math.min(720, d.height || 420)),
    doc: d.doc,
    styleId: 'ai', styleLabel: 'AI · '+(aiModel||'sonnet'),
    sref: 'ai-'+Math.random().toString(36).slice(2,7),
    prompt: promptRaw,
  }));
}

async function smartGenerate(promptRaw, n, replace){
  showGenToast(promptRaw, n);
  if(aiCheckbox.checked && aiAvailable){
    try{
      const ai = await generateBatchAI(promptRaw, n);
      if(replace){ designStore.clear(); feedEl.innerHTML=''; }
      appendDesigns(ai);
      hideGenToast();
      return;
    }catch(e){
      console.warn('AI failed, falling back:', e.message);
      flash('AI 失败，回退本地模板');
    }
  }
  // 若 replace，先清仓再生成（此时排除集合应为空，让三张 dashboard 可重新出现）
  if(replace){ designStore.clear(); feedEl.innerHTML=''; }
  const local = generateBatch(promptRaw, currentStyle, n, { excludeStyleLocks: collectUsedStyleLocks() });
  appendDesigns(local);
  setTimeout(hideGenToast, 600);
}

function buildPinnedFor(styleId, headlineFallback){
  const p = parsePrompt(promptEl.value || headlineFallback || 'Design DNA');
  const style = STYLES.find(s => s.id === styleId);
  if(!style) return null;
  // 动态查找带对应 styleLock 的模板
  let tplIdx = -1;
  for(let i=0;i<TEMPLATES.length;i++){
    try{
      const probe = TEMPLATES[i]({headline:'probe'}, style.tokens);
      if(probe && probe.styleLock === styleId){ tplIdx = i; break; }
    }catch(_){}
  }
  if(tplIdx < 0) return null;
  const design = TEMPLATES[tplIdx](p, style.tokens);
  return {
    id: 'd' + (idCounter++).toString(36).padStart(4,'0'),
    styleId: style.id, styleLabel: style.label,
    sref: style.id + '-featured',
    prompt: p.raw,
    pinned: true,
    featured: true,
    ...design
  };
}

      if(c && c.styleLock && pinnedLocks.indexOf(c.styleLock) < 0) pinnedLocks.push(c.styleLock);
    });
  } catch(_){}
  // 3) [TEMP DISABLED] 随机批次先屏蔽，feed 只展示 nothing + retro-ascii
  // try {
  //   var more = generateBatch(promptEl.value, currentStyle, 10, { excludeStyleLocks: pinnedLocks });
  //   firstBatch = firstBatch.concat(more);
  // } catch(_){}
  if (firstBatch.length === 0) {
    var t = STYLES[0].tokens;
    var p = parsePrompt('Hello Design DNA');
    var fb = TEMPLATES[0](p, t);
    firstBatch.push(Object.assign({ id:'fb0', styleId:'notion', styleLabel:'fallback', sref:'fb-0', prompt:p.raw }, fb));
  }
  // ─── 分批渲染 firstBatch 以降低首屏 DOM/iframe 创建压力 ───
  // 首批立即渲染（首屏可见 + 少量缓冲），后续批次在浏览器空闲或滚动接近底部时再追加。
  var INITIAL_RENDER = 8;     // 首批渲染数量
  var NEXT_BATCH     = 6;     // 后续每批数量
  var pendingDesigns = firstBatch.slice();
  function _flushNextBatch(){
    if(!pendingDesigns.length) return;
    var slice = pendingDesigns.splice(0, NEXT_BATCH);
    appendDesigns(slice);
  }
  // 1) 首批立即渲染
  appendDesigns(pendingDesigns.splice(0, INITIAL_RENDER));
  // 2) 用 requestIdleCallback / 退化的 setTimeout 在主线程空闲时分批续渲
  var _idle = window.requestIdleCallback || function(cb){ return setTimeout(function(){ cb({timeRemaining:function(){return 12;}, didTimeout:false}); }, 220); };
  function _idleAppend(){
    if(!pendingDesigns.length) return;
    _flushNextBatch();
    if(pendingDesigns.length) _idle(_idleAppend);
  }
  _idle(_idleAppend);
  // 3) 滚动接近底部时也强制推一批，保证用户向下滚永远能看到内容
  var _sentinel = document.getElementById('sentinel');
  if(_sentinel && 'IntersectionObserver' in window){
    var sio = new IntersectionObserver(function(ents){
      ents.forEach(function(e){ if(e.isIntersecting){ _flushNextBatch(); } });
    }, { rootMargin: '600px 0px' });
    sio.observe(_sentinel);
  }
})();

// ─── 登录系统 ───────────────────────────────────
const AUTH_KEY = 'variant.auth.user';
const authMask = document.getElementById('authMask');
const authClose = document.getElementById('authClose');
const sideAvatar = document.getElementById('sideAvatar');
const userPop = document.getElementById('userPop');
const popEmail = document.getElementById('popEmail');

function getUser(){
  try{ return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); }catch{ return null; }
}
function setUser(u){
  if(u){ localStorage.setItem(AUTH_KEY, JSON.stringify(u)); }
  else { localStorage.removeItem(AUTH_KEY); }
  renderAvatar();
}
function renderAvatar(){
  const u = getUser();
  if(u){
    sideAvatar.classList.add('signed');
    sideAvatar.textContent = (u.email || '?').trim()[0].toUpperCase();
    sideAvatar.title = u.email;
    sideAvatar.style.background = '#1a1a1a';
    if(popEmail) popEmail.textContent = u.email;
  }else{
    sideAvatar.classList.remove('signed');
    sideAvatar.textContent = '';
    sideAvatar.title = '登录';
    sideAvatar.style.background = '';
  }
}
renderAvatar();

// Modal 切步骤
function showStep(name){
  document.querySelectorAll('.auth-step').forEach(s=>{
    s.classList.toggle('show', s.dataset.step === name);
  });
  if(name === 'email') setTimeout(()=>document.getElementById('authEmail').focus(), 50);
  if(name === 'otp')   setTimeout(()=>document.querySelector('.auth-otp input').focus(), 50);
}
function openAuth(){
  authMask.classList.add('open');
  showStep('choose');
  document.getElementById('authMsg').textContent = '';
  document.getElementById('authEmail').value = '';
  document.querySelectorAll('.auth-otp input').forEach(i=>i.value='');
}
function closeAuth(){ authMask.classList.remove('open'); }

authClose.addEventListener('click', closeAuth);
authMask.addEventListener('click', e=>{ if(e.target === authMask) closeAuth(); });
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && authMask.classList.contains('open')) closeAuth();
});

// 头像点击
sideAvatar.addEventListener('click', e=>{
  e.stopPropagation();
  console.log('[avatar] click fired', { user: getUser() });
  const u = getUser();
  if(u){
    userPop.classList.toggle('open');
  }else{
    openAuth();
  }
});
// 兜底：mousedown 也触发，避免某些事件被吞
sideAvatar.addEventListener('mousedown', e=>{
  console.log('[avatar] mousedown', e.target);
});

// 点击外部关闭气泡
document.addEventListener('click', e=>{
  if(!userPop.contains(e.target) && e.target !== sideAvatar){
    userPop.classList.remove('open');
  }
});

// 气泡菜单动作
userPop.addEventListener('click', e=>{
  const item = e.target.closest('.pop-item');
  if(!item) return;
  const act = item.dataset.act;
  userPop.classList.remove('open');
  if(act === 'logout'){
    setUser(null);
  }else if(act === 'saved'){
    // 复用收藏面板（如果存在）
    const sb = document.getElementById('btnSaved');
    if(sb) sb.click();
  }else if(act === 'settings'){
    openSettings();
  }
});

const settingsMask = document.getElementById('settingsMask');
const settingsClose = document.getElementById('settingsClose');
const langGrid = document.getElementById('langGrid');
const setToast = document.getElementById('setToast');
const CHECK_SVG = '<svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

function getLang(){ return localStorage.getItem('app:lang') || 'zh-CN'; }
function tr(key, code){
  // 防 TDZ：I18N 字典声明在文件下方，早期渲染（如 renderSavedPanel 首次执行）
  // 直接读 const 会触发暂存死区 ReferenceError 中断整脚本，这里 try/catch 兜底
  let dict;
  try { dict = I18N; } catch(_) { return key; }
  const c = code || getLang();
  const t = dict[c] || dict['zh-CN'];
  return (t && t[key]) || (dict['zh-CN'] && dict['zh-CN'][key]) || key;
}
function applyLang(code){
  const t = I18N[code] || I18N['zh-CN'];
  document.documentElement.lang = code;
  document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  // 通用遍历：textContent
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if (t[k] != null) el.textContent = t[k];
  });
  // innerHTML（含 <a> 链接的法律条款行）
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const k = el.getAttribute('data-i18n-html');
    if (t[k] != null) el.innerHTML = t[k];
  });
  // title
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{
    const k = el.getAttribute('data-i18n-title');
    if (t[k] != null) el.title = t[k];
  });
  // placeholder
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const k = el.getAttribute('data-i18n-ph');
    if (t[k] != null) el.placeholder = t[k];
  });
  if(setToast) setToast.textContent = t.saved;
  // 同步刷新语言列表的选中态
  if (langGrid) langGrid.querySelectorAll('.lang-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.code === code);
  });
  // 通知 iframe 内卡片切语言
  document.querySelectorAll('iframe[data-card]').forEach(f=>{
    try{ f.contentWindow && f.contentWindow.postMessage({type:'lang', code}, '*'); }catch(_){}
  });
}
function renderLangGrid(){
  const cur = getLang();
  langGrid.innerHTML = LANGS.map(l => `
    <button class="lang-item${l.code===cur?' active':''}" data-code="${l.code}">
      <span class="lang-flag">${l.flag}</span>
      <span class="lang-name">
        <span class="lang-native">${l.native}</span>
        <span class="lang-en">${l.en}</span>
      </span>
      ${CHECK_SVG}
    </button>
  `).join('');
}
function openSettings(){
  renderLangGrid();
  applyLang(getLang());
  settingsMask.classList.add('open');
}
function closeSettings(){ settingsMask.classList.remove('open'); }
settingsClose.addEventListener('click', closeSettings);
settingsMask.addEventListener('click', e=>{ if(e.target === settingsMask) closeSettings(); });
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && settingsMask.classList.contains('open')) closeSettings();
});
langGrid.addEventListener('click', e=>{
  const item = e.target.closest('.lang-item');
  if(!item) return;
  const code = item.dataset.code;
  localStorage.setItem('app:lang', code);
  applyLang(code);
  setToast.classList.add('show');
  clearTimeout(setToast._t);
  setToast._t = setTimeout(()=> setToast.classList.remove('show'), 1400);
});
// 启动时根据持久化语言初始化
applyLang(getLang());

// Step 1：选邮箱/Google/Apple
document.querySelectorAll('[data-oauth]').forEach(b=>{
  b.addEventListener('click',()=>{
    const kind = b.dataset.oauth;
    if(kind === 'email'){ showStep('email'); return; }
    // Google / Apple：demo 模拟直接登录
    setUser({ email: kind === 'google' ? 'demo@gmail.com' : 'demo@icloud.com', via: kind });
    closeAuth();
  });
});

// Step 2：发送验证码
document.getElementById('authBack').addEventListener('click', ()=>showStep('choose'));
document.getElementById('authSend').addEventListener('click', ()=>{
  const email = document.getElementById('authEmail').value.trim();
  const msg = document.getElementById('authMsg');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    msg.textContent = tr('emailInvalid');
    msg.classList.add('error');
    return;
  }
  msg.textContent = '';
  msg.classList.remove('error');
  document.getElementById('otpEmail').textContent = email;
  showStep('otp');
});
document.getElementById('authEmail').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('authSend').click();
});

// Step 3：OTP 输入 + 验证
const otpInputs = document.querySelectorAll('.auth-otp input');
otpInputs.forEach((inp,idx)=>{
  inp.addEventListener('input', e=>{
    const v = e.target.value.replace(/[^0-9]/g,'').slice(-1);
    e.target.value = v;
    if(v && otpInputs[idx+1]) otpInputs[idx+1].focus();
  });
  inp.addEventListener('keydown', e=>{
    if(e.key === 'Backspace' && !inp.value && otpInputs[idx-1]) otpInputs[idx-1].focus();
    if(e.key === 'Enter') document.getElementById('authVerify').click();
  });
  inp.addEventListener('paste', e=>{
    const txt = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g,'').slice(0,6);
    if(!txt) return;
    e.preventDefault();
    [...txt].forEach((c,i)=>{ if(otpInputs[i]) otpInputs[i].value = c; });
    (otpInputs[Math.min(txt.length, 5)]).focus();
  });
});
document.getElementById('authBackOtp').addEventListener('click', ()=>showStep('email'));
document.getElementById('authVerify').addEventListener('click', ()=>{
  const code = [...otpInputs].map(i=>i.value).join('');
  const msg = document.getElementById('otpMsg');
  if(code.length !== 6){
    msg.textContent = tr('otpIncomplete');
    msg.classList.add('error');
    return;
  }
  setUser({ email: document.getElementById('authEmail').value.trim(), via: 'email' });
  closeAuth();
});
</script>
