<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design DNA — endless designs, just scroll</title>
<!-- POSTER 缓存版本：每次替换 posters/*.jpg 时手动 +1，让浏览器立刻拉新图。 -->
<script>window.POSTER_VERSION = '2';</script>
<!-- JSZip 懒加载：仅在用户点击「下载素材包」时按需注入，避免首屏 100KB CDN 阻塞 -->
<script>
  window.__loadJSZip = function(){
    if(typeof JSZip !== 'undefined') return Promise.resolve();
    if(window.__jszipPromise) return window.__jszipPromise;
    window.__jszipPromise = new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
      s.onload = function(){ resolve(); };
      s.onerror = reject;
      document.head.appendChild(s);
    });
    return window.__jszipPromise;
  };
</script>
<style>
  :root{
    --bg:#0a0a0a;--bg-soft:#111;--bg-card:#151515;
    --border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.16);
    --text:#f5f5f5;--text-soft:#a1a1a1;--text-mute:#666;
    --accent:#e8f060;--accent-ink:#111;--radius:14px;
    --side-w:56px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}

  /* ─── 左侧极窄 Sidebar ─── */
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--side-w);background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;z-index:90;gap:4px}
  .side-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%}
  .side-logo{width:30px;height:30px;border-radius:9px;background:#0F0F10;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:6px;border:1px solid rgba(255,255,255,.08);transition:transform .15s ease}
  .side-logo:hover{transform:scale(1.04)}
  .side-tab{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-soft);background:transparent;border:0;transition:all .15s ease;position:relative}
  .side-tab:hover{background:rgba(255,255,255,.05);color:var(--text)}
  .side-tab.active{background:rgba(255,255,255,.08);color:var(--text)}
  .side-tab.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:2px;height:18px;background:var(--accent);border-radius:0 2px 2px 0}
  .side-tip{position:absolute;left:46px;top:50%;transform:translateY(-50%) translateX(-4px);background:#1c1c1c;color:#fff;padding:5px 10px;border-radius:6px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:all .15s ease;border:1px solid var(--border);z-index:80}
  .side-tab:hover .side-tip{opacity:1;transform:translateY(-50%) translateX(0)}
  .side-spacer{flex:1}
  .side-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#E8DFD2,#5E6AD2);margin-top:auto;margin-bottom:8px;position:relative;z-index:100;pointer-events:auto}
  /* 扩大头像点击热区，避免点歪 */
  .side-avatar::after{content:'';position:absolute;inset:-10px;border-radius:50%;z-index:1}

  /* ─── 顶部社区切换已移除 ─── */

  /* ─── 主区瀑布流：CSS Grid masonry（行 8px，按内容高度 span） ─── */
  .stage{margin-left:var(--side-w);padding:8px 8px 120px;min-height:100vh}
  /* 基线 3 列 —— 每行 3 张卡，是默认状态。
     超宽屏升到 6 列基线，常规卡 span 2（仍 3/行），仅"竖屏窄卡"span 1（6/行）。
     窄屏退到 2 列。 */
  .feed{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:8px;gap:8px;grid-auto-flow:dense}
  .feed > .card{grid-column:span 2}
  .card.is-narrow{grid-column:span 1}
  @media (max-width:1680px){
    .feed{grid-template-columns:repeat(3,minmax(0,1fr))}
    .feed > .card,.card.is-narrow{grid-column:span 1}
  }
  @media (max-width:900px){
    .feed{grid-template-columns:repeat(2,minmax(0,1fr))}
    .feed > .card,.card.is-narrow{grid-column:span 1}
  }
  .card{margin:0;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative;cursor:pointer;transition:transform .2s ease,border-color .2s ease;animation:rise .5s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card:hover{border-color:var(--border-strong)}
  .card-frame{width:100%;display:block;border:0;background:#0a0a0a;color-scheme:dark;pointer-events:none}
  .card-frame--live{position:absolute;inset:0;width:100%;opacity:0;transition:opacity .35s ease}
  .card.has-scale > .card-frame--live{position:absolute;top:0;left:0;width:auto}
  .card.is-live .card-frame--live{opacity:1}
  /* 静态 jpg 占位：外链卡 feed 内降级用 <img> 而非 iframe，零开销。
     用 !important 是为了覆盖 .card.has-scale > .card-frame { width:auto }。 */
  img.card-poster-fill{position:absolute !important;inset:0 !important;width:100% !important;height:100% !important;object-fit:cover !important;transform:none !important;opacity:0;transition:opacity .35s ease;z-index:1}
  .card.is-live img.card-poster-fill{opacity:1}
  .card-preview{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:linear-gradient(180deg,#1a1a1a,#111);color:#fff;pointer-events:none;transition:opacity .35s ease;overflow:hidden}
  .card-preview .card-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .card-preview .card-preview-title,.card-preview .card-preview-sub{position:relative;z-index:1}
  .card-preview-shimmer{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);background-size:250% 100%;animation:shimmer 2s ease-in-out infinite}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .card-preview.is-hiding{opacity:0}
  .card-preview::before{content:'';position:absolute;inset:12px;border:1px solid rgba(255,255,255,.08);border-radius:8px;pointer-events:none}
  .card-preview-title{font-size:15px;font-weight:600;max-width:80%;line-height:1.35;color:#f5f5f5}
  .card-preview-sub{font-size:11px;color:var(--text-mute)}
  /* dashboard 卡用 transform scale 缩放：iframe 用绝对定位 + 固定逻辑宽 */
  .card.has-scale{position:relative}
  .card.has-scale > .card-frame{position:absolute;top:0;left:0;width:auto}
  /* [REMOVED] .card-meta / .card-title / .icon-btn —— 底部 hover 操作条已并入右上角 .card-actions */
  .card-badge{position:absolute;top:8px;right:8px;display:flex;gap:4px;align-items:center;padding:3px 7px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border-radius:999px;font-size:10px;color:#fff;opacity:0;transition:opacity .2s ease;z-index:3}
  .card:hover .card-badge{opacity:1}

  /* ─── Hover 右上角操作组：收藏 + 点赞 ─── */
  .card-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transform:translateY(-4px);transition:opacity .18s ease, transform .18s ease;pointer-events:none;z-index:5}
  .card:hover .card-actions{opacity:1;transform:none;pointer-events:auto}
  .card:hover .card-badge{opacity:0;pointer-events:none}                       /* hover 时 badge 让位给 actions */
  .card-actions .act{width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .15s ease,border-color .15s ease,color .15s ease,transform .15s ease}
  .card-actions .act:hover{background:rgba(0,0,0,.82);border-color:rgba(255,255,255,.26);transform:translateY(-1px)}
  .card-actions .act svg{width:14px;height:14px;display:block;transition:fill .15s ease}
  .card-actions .act.is-on{background:#fff;border-color:#fff;color:#111}
  .card-actions .act.is-on svg{fill:currentColor}
  @keyframes actPop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
  .card-actions .act.pop svg{animation:actPop .35s ease}

  /* ─── Hover 浮出操作：复制代码 ─── */
  .card-fav{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;background:rgba(0,0,0,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:11px;font-weight:500;color:#fff;cursor:pointer;opacity:0;transform:translateY(-4px);transition:opacity .18s ease, transform .18s ease, background .15s ease;z-index:4;letter-spacing:.01em}
  .card:hover .card-fav{opacity:1;transform:none}
  .card-fav:hover{background:rgba(0,0,0,.82);border-color:rgba(255,255,255,.22)}
  .card-fav svg{width:13px;height:13px;flex-shrink:0;transition:fill .15s ease,stroke .15s ease}
  .card-fav.is-on svg{fill:#fff}
  @keyframes featPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
  .card-fav.pulse{animation:featPulse .6s ease}

  .sentinel{height:60px;display:flex;align-items:center;justify-content:center;color:var(--text-mute);font-size:13px}
  .dot-loader{display:inline-flex;gap:4px}
  .dot-loader span{width:6px;height:6px;border-radius:50%;background:var(--text-mute);animation:bounce 1.2s infinite ease-in-out}
  .dot-loader span:nth-child(2){animation-delay:.15s}
  .dot-loader span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

  /* ─── 底部浮动 Prompt 条 ─── */
  .prompt-dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:55;width:min(640px,calc(100vw - 80px - var(--side-w)));margin-left:calc(var(--side-w) / 2)}
  .prompt-wrap{background:rgba(20,20,20,0.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--border-strong);border-radius:16px;padding:10px 10px 8px;box-shadow:0 16px 48px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.02)}
  .prompt-input{width:100%;background:transparent;border:0;outline:0;color:var(--text);font-size:14px;resize:none;min-height:24px;max-height:120px;padding:6px 8px;font-family:inherit;line-height:1.5}
  .prompt-input::placeholder{color:var(--text-mute)}
  .prompt-bar{display:flex;align-items:center;gap:6px;padding-top:4px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:11.5px;color:var(--text-soft);background:rgba(255,255,255,0.04);border:1px solid var(--border);cursor:pointer;transition:all .15s ease}
  .chip:hover{background:rgba(255,255,255,.08);color:var(--text)}
  .chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .chip-swatch{width:9px;height:9px;border-radius:3px}
  .submit{margin-left:auto;width:30px;height:30px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
  .submit:hover{background:#d9e152}

  /* ─── 左下浮动 chips（视图模式）已移除 ─── */

  /* ─── 右下"生成中"浮卡 ─── */
  .gen-toast{position:fixed;right:14px;bottom:18px;z-index:55;width:240px;padding:12px 14px;background:rgba(15,15,15,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px -8px rgba(0,0,0,.7);transform:translateY(20px);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.4,.2,.2,1)}
  .gen-toast.show{transform:none;opacity:1;pointer-events:auto}
  .gen-toast-row{display:flex;align-items:center;gap:10px}
  .gen-spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin 1s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .gen-title{font-size:12px;font-weight:500;color:var(--text);flex:1;min-width:0}
  .gen-sub{font-size:10.5px;color:var(--text-mute);margin-top:2px}
  .gen-close{width:20px;height:20px;border-radius:6px;border:0;background:transparent;color:var(--text-mute);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .gen-close:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .gen-bar{height:2px;background:var(--border);border-radius:99px;margin-top:10px;overflow:hidden}
  .gen-bar-fill{height:100%;background:var(--accent);width:30%;animation:slide 1.4s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}

  /* ─── Detail（整页 · 参考 Variant：面包屑返回） ─── */
  .detail-view{position:fixed;inset:0;left:var(--side-w);background:var(--bg);z-index:70;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .22s ease, transform .22s ease}
  .detail-view.open{opacity:1;pointer-events:auto;transform:none}
  body.is-detail{overflow:hidden}
  /* 进入详情时，隐藏主 feed 附属 UI，避免穿透 */
  body.is-detail .prompt-dock,
  body.is-detail .gen-toast,
  body.is-detail .saved-panel,
  body.is-detail .style-drawer{opacity:0;pointer-events:none;transition:opacity .15s ease}

  .detail-top{height:52px;flex-shrink:0;padding:0 24px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:2}
  .crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-soft);min-width:0}
  .crumb-link{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;color:var(--text-soft);background:transparent;border:0;cursor:pointer;font:inherit;transition:background .15s ease, color .15s ease}
  .crumb-link:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .crumb-sep{color:var(--text-mute);font-size:12px;user-select:none}
  .crumb-current{color:var(--text);font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
  .detail-top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
  .detail-sref{font-size:11.5px;color:var(--text-mute);margin-right:6px;font-variant-numeric:tabular-nums}

  .detail-body{flex:1;overflow:auto;padding:20px 32px 40px;display:flex;justify-content:center}
  .detail-stage{width:min(1600px,100%);display:flex;flex-direction:column;gap:14px}
  .detail-frame-wrap{border-radius:14px;overflow:hidden;background:transparent}
  .detail-frame{width:100%;border:0;background:transparent;display:block}
  .detail-meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 2px;font-size:12.5px;color:var(--text-soft)}
  .detail-meta-row .dot{width:3px;height:3px;border-radius:50%;background:var(--text-mute)}

  .drawer-sub{font-size:12px;color:var(--text-mute)}
  .btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:500;border:1px solid var(--border-strong);background:transparent;color:var(--text);transition:background .15s ease}
  .btn:hover{background:rgba(255,255,255,0.04)}
  .btn-icon{width:32px;padding:0;justify-content:center}

  /* ─── Saved Panel ─── */
  .saved-panel{position:fixed;left:calc(var(--side-w) + 8px);top:50px;width:280px;max-height:60vh;overflow:auto;background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:12px;z-index:60;opacity:0;pointer-events:none;transform:translateY(-8px);transition:all .2s ease}
  .saved-panel.open{opacity:1;pointer-events:auto;transform:none}
  .saved-panel h3{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--text-soft)}
  .saved-item{display:flex;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
  .saved-item:hover{background:rgba(255,255,255,.04)}
  .saved-thumb{width:44px;height:44px;border-radius:8px;background:#fff;flex-shrink:0;overflow:hidden}
  .saved-thumb iframe{width:220px;height:220px;border:0;transform:scale(.2);transform-origin:top left;pointer-events:none}
  .saved-meta{font-size:12px;color:var(--text-soft);line-height:1.4;overflow:hidden}
  .saved-empty{color:var(--text-mute);font-size:12px;text-align:center;padding:18px 0}

  /* ─── Style Drawer（左侧 sidebar 展开） ─── */
  .style-drawer{position:fixed;left:var(--side-w);top:0;bottom:0;width:280px;background:var(--bg-soft);border-right:1px solid var(--border);z-index:55;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,.2,.2,1);display:flex;flex-direction:column;padding:16px 14px}
  .style-drawer.open{transform:none}
  .style-drawer h3{margin:6px 4px 12px;font-size:12px;color:var(--text-soft);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
  .style-list{display:flex;flex-direction:column;gap:4px}
  .style-list .chip{justify-content:flex-start;height:34px;width:100%;font-size:13px;padding:0 12px;border-radius:8px}

  /* ─── 头像（可点击） ─── */
  .side-avatar{cursor:pointer;transition:transform .15s ease, box-shadow .15s ease}
  .side-avatar:hover{transform:scale(1.06);box-shadow:0 0 0 2px rgba(255,255,255,.12)}
  .side-avatar.signed{background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:12px;font-weight:600;letter-spacing:.02em}

  /* ─── 登录 Modal ─── */
  .auth-mask{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;animation:fadeIn .18s ease}
  .auth-mask.open{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .auth-card{width:380px;background:#0f0f0f;border:1px solid var(--border);border-radius:16px;padding:32px 28px 26px;box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pop .22s cubic-bezier(.4,.2,.2,1)}
  .auth-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .auth-close:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .auth-card{position:relative}
  .auth-logo{width:42px;height:42px;border-radius:10px;background:var(--accent);color:#000;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px}
  .auth-title{text-align:center;font-size:18px;font-weight:600;color:var(--text);margin-bottom:6px}
  .auth-sub{text-align:center;font-size:13px;color:var(--text-soft);margin-bottom:22px}
  .auth-btn{width:100%;height:42px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:all .15s ease;margin-bottom:8px}
  .auth-btn:hover{background:rgba(255,255,255,.08);border-color:var(--border-strong)}
  .auth-btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
  .auth-btn.primary:hover{background:#f5e896}
  .auth-btn:disabled{opacity:.5;cursor:not-allowed}
  .auth-divider{display:flex;align-items:center;gap:10px;color:var(--text-soft);font-size:11px;margin:14px 0;text-transform:uppercase;letter-spacing:.06em}
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .auth-input{width:100%;height:42px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);font-size:14px;padding:0 14px;outline:none;transition:border-color .15s ease;margin-bottom:10px;font-family:inherit}
  .auth-input:focus{border-color:var(--accent)}
  .auth-foot{text-align:center;font-size:12px;color:var(--text-soft);margin-top:14px;line-height:1.6}
  .auth-foot a{color:var(--text);text-decoration:underline;cursor:pointer}
  .auth-back{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-soft);background:transparent;border:0;cursor:pointer;margin-bottom:10px;padding:0}
  .auth-back:hover{color:var(--text)}
  .auth-otp{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}
  .auth-otp input{width:42px;height:48px;text-align:center;font-size:18px;font-weight:600;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);outline:none;font-family:inherit}

  .auth-step.show{display:block}
  .auth-msg{font-size:12px;color:var(--text-soft);text-align:center;margin-bottom:10px}
  .auth-msg.error{color:#ff6b6b}

  /* ─── 头像气泡菜单 ─── */
  .user-pop{position:fixed;left:calc(var(--side-w) + 8px);bottom:14px;width:220px;background:#0f0f0f;border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.5);padding:6px;z-index:150;display:none;animation:pop .18s cubic-bezier(.4,.2,.2,1)}

  .user-pop .pop-head{padding:10px 12px 8px;border-bottom:1px solid var(--border);margin-bottom:4px}
  .user-pop .pop-head .e{font-size:13px;color:var(--text);font-weight:500;word-break:break-all}
  .user-pop .pop-head .t{font-size:11px;color:var(--text-soft);margin-top:2px}
  .pop-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:var(--text-soft);font-size:13px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
  .pop-item:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .pop-item.danger:hover{color:#ff6b6b}

  /* ─── 设置 Modal ─── */
  .settings-mask{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;animation:fadeIn .18s ease}
  .settings-mask.open{display:flex}
  .settings-card{position:relative;width:480px;max-height:78vh;background:#0f0f0f;border:1px solid var(--border);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pop .22s cubic-bezier(.4,.2,.2,1);display:flex;flex-direction:column;overflow:hidden}
  .settings-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid var(--border)}
  .settings-head h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
  .settings-close{width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .settings-close:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .settings-body{padding:18px 22px 20px;overflow:auto}
  .settings-section{margin-bottom:18px}
  .settings-section:last-child{margin-bottom:0}
  .settings-label{font-size:11px;color:var(--text-soft);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;font-weight:500}
  .settings-desc{font-size:12px;color:var(--text-soft);margin-top:4px;line-height:1.5}
  .lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .lang-item{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s ease;text-align:left;font-family:inherit;width:100%}
  .lang-item:hover{background:rgba(255,255,255,.05);border-color:var(--border-strong)}
  .lang-item.active{border-color:var(--accent);background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--accent)}
  .lang-flag{font-size:18px;line-height:1;flex-shrink:0}
  .lang-name{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
  .lang-native{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lang-en{font-size:11px;color:var(--text-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lang-check{width:14px;height:14px;color:var(--accent);opacity:0;transition:opacity .12s ease;flex-shrink:0}
  .lang-item.active .lang-check{opacity:1}
  .settings-toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) translateY(8px);background:rgba(20,20,20,.96);border:1px solid var(--border-strong);color:var(--text);font-size:12px;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:all .22s cubic-bezier(.4,.2,.2,1);box-shadow:0 8px 24px rgba(0,0,0,.5)}

</style>
