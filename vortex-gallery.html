<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.173.0",
    "three/addons/": "https://esm.sh/three@0.173.0/examples/jsm/",
    "gsap": "https://esm.sh/gsap@3.12.7",
    "normalize-wheel": "https://esm.sh/normalize-wheel@1.0.1"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import gsap from "gsap";
import normalizeWheel from "normalize-wheel";

/* ============ shaders (inlined from src/shaders) ============ */
const vertexShader = /* glsl */`
#define PI 3.14159265359

attribute float aAngle;
attribute float aHeight;
attribute float aRadius;
attribute float aAspectRatio;
attribute float aSpeed;
attribute vec4 aTextureCoords;
attribute vec2 aImageRes;

varying vec4 vTextureCoords;
varying vec2 vUv;
varying float vAspectRatio;

uniform float uMaxZ;
uniform float uZrange;
uniform float uTime;
uniform float uScrollY;
uniform float uSpeedY;
uniform float uDirection;

vec4 getQuaternionFromAxisAngle(vec3 axis, float angle){
    float halfAngle = angle * 0.5;
    return vec4(axis.xyz * sin(halfAngle), cos(halfAngle));
}

void main(){
    vec3 scaledPosition = position;
    scaledPosition.y /= aAspectRatio;

    float zPos = aHeight + uScrollY;
    float zRange = uZrange;
    float minZ = (uMaxZ - uZrange);
    zPos = mod(zPos - minZ, zRange) + minZ;

    float theta = aAngle + uSpeedY * 0.4 * aSpeed;
    vec3 instancePosition = vec3(cos(theta) * aRadius, zPos, sin(theta) * aRadius);

    float angle = atan(instancePosition.x, instancePosition.z);
    vec4 rotation = getQuaternionFromAxisAngle(vec3(0.0, 1.0, 0.0), angle);

    vec3 finalPosition = scaledPosition +
        2.0 * cross(rotation.xyz, cross(rotation.xyz, scaledPosition) + rotation.w * scaledPosition);

    vec4 modelPosition = modelMatrix * vec4(instancePosition + finalPosition, 1.0);
    vec4 viewPosition  = viewMatrix * modelPosition;
    gl_Position        = projectionMatrix * viewPosition;

    vUv = uv;
    vTextureCoords = aTextureCoords;
    vAspectRatio = aAspectRatio;
}
`;

const fragmentShader = /* glsl */`
varying vec2 vUv;
uniform sampler2D uAtlas;
varying vec4 vTextureCoords;

void main(){
    float xStart = vTextureCoords.x;
    float xEnd   = vTextureCoords.y;
    float yStart = vTextureCoords.z;
    float yEnd   = vTextureCoords.w;

    vec2 atlasUV = vec2(
        mix(xStart, xEnd, vUv.x),
        mix(yStart, yEnd, 1.0 - vUv.y)
    );

    vec4 color = texture2D(uAtlas, atlasUV);
    gl_FragColor = color;
}
`;

const centerVertex = /* glsl */`
varying vec2 vUv;
void main(){
    vec4 modelPosition = modelMatrix * vec4(position, 1.0);
    vec4 viewPosition  = viewMatrix * modelPosition;
    gl_Position        = projectionMatrix * viewPosition;
    vUv = uv;
}
`;

const centerFragment = /* glsl */`
varying vec2 vUv;
uniform sampler2D uAtlas;
uniform vec4 uTextureCoords;

void main(){
    float xStart = uTextureCoords.x;
    float xEnd   = uTextureCoords.y;
    float yStart = uTextureCoords.z;
    float yEnd   = uTextureCoords.w;

    vec2 atlasUV = vec2(
        mix(xStart, xEnd, vUv.x),
        mix(yStart, yEnd, 1.0 - vUv.y)
    );

    vec4 color = texture2D(uAtlas, atlasUV);
    gl_FragColor = color;
}
`;

/* ============ Gallery (port of src/gallery.ts) ============ */
class Gallery{
  constructor({ scene, cameraZ }){
    this.scene = scene;
    this.cameraZ = cameraZ;
    this.scrollY = { speedTarget:0, speedCurrent:0, target:0, current:0, direction:1 };
    this.textureIndex = 0;
    this.imageInfos = [];
    this.atlasTexture = null;

    this.loadTextureAtlas().then(()=>{
      this.createInstancedMesh();
      this.createCenteredMesh();
      window.dispatchEvent(new CustomEvent('vortex-ready'));
    });
  }

  async loadTextureAtlas(){
    const base = './vortex-gallery-frames/512/';
    const imagePaths = [
      'p1.jpg','p2.jpg','p3.jpg','p4.jpg','p5.jpg',
      'p6.jpg','p7.jpg','p8.jpg','p9.jpg','p10.jpg',
      'p11.jpg','p12.jpg','p13.jpg',
      '14.jpg','15.jpg','16.jpg','17.jpg','18.jpg','19.jpg','20.jpg'
    ].map(n=>base+n);

    const images = await Promise.all(imagePaths.map(path => new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=>resolve(img);
      img.onerror = ()=>resolve(img); // tolerate
      img.src = path;
    })));

    const atlasWidth = Math.max(...images.map(i=>i.width||512));
    let totalHeight = 0;
    images.forEach(img=>{ totalHeight += (img.height||512); });

    const canvas = document.createElement('canvas');
    canvas.width = atlasWidth;
    canvas.height = totalHeight;
    const ctx = canvas.getContext('2d');

    let currentY = 0;
    this.imageInfos = images.map(img=>{
      const w = img.width || 512, h = img.height || 512;
      const aspectRatio = w / h;
      ctx.drawImage(img, 0, currentY);
      const info = {
        width:w, height:h, aspectRatio,
        uvs:{
          xStart:0,
          xEnd: w / atlasWidth,
          yStart: 1 - currentY / totalHeight,
          yEnd:   1 - (currentY + h) / totalHeight
        }
      };
      currentY += h;
      return info;
    });

    this.atlasTexture = new THREE.Texture(canvas);
    this.atlasTexture.needsUpdate = true;
  }

  createInstancedMesh(){
    const geometry = new THREE.BoxGeometry(1.5, 1.5, 0.075);
    const RADIUS = 6;
    const HEIGHT = 120;
    const COUNT = 600;
    const TOTAL = COUNT;

    this.instancedMaterial = new THREE.ShaderMaterial({
      vertexShader, fragmentShader,
      precision:'highp',
      transparent:true,
      uniforms:{
        uTime: new THREE.Uniform(0),
        uAtlas: new THREE.Uniform(this.atlasTexture),
        uScrollY: new THREE.Uniform(0),
        uZrange: new THREE.Uniform(HEIGHT),
        uMaxZ: new THREE.Uniform(HEIGHT * 0.5),
        uSpeedY: new THREE.Uniform(0),
        uDirection: new THREE.Uniform(this.scrollY.direction),
      }
    });

    const instancedMesh = new THREE.InstancedMesh(geometry, this.instancedMaterial, TOTAL);

    const aAngles = new Float32Array(TOTAL);
    const aHeights = new Float32Array(TOTAL);
    const aRadiuses = new Float32Array(TOTAL);
    const aAspectRatios = new Float32Array(TOTAL);
    const aSpeeds = new Float32Array(TOTAL);
    const aImagesRes = new Float32Array(TOTAL * 2);
    const aTextureCoords = new Float32Array(TOTAL * 4);

    const CIRCLE_COUNT = HEIGHT / 3;
    const CIRCLE_HEIGHT = HEIGHT / CIRCLE_COUNT;
    const speeds = new Float32Array(CIRCLE_COUNT);
    for(let j=0;j<CIRCLE_COUNT;j++) speeds[j] = Math.random()*0.2 + 0.8;

    for(let i=0;i<COUNT;i++){
      const angle = (i / COUNT) * Math.PI * 2;
      const imageIndex = Math.floor(Math.random() * this.imageInfos.length);

      aTextureCoords[i*4+0] = this.imageInfos[imageIndex].uvs.xStart;
      aTextureCoords[i*4+1] = this.imageInfos[imageIndex].uvs.xEnd;
      aTextureCoords[i*4+2] = this.imageInfos[imageIndex].uvs.yStart;
      aTextureCoords[i*4+3] = this.imageInfos[imageIndex].uvs.yEnd;

      aImagesRes[i*2+0] = this.imageInfos[imageIndex].width;
      aImagesRes[i*2+1] = this.imageInfos[imageIndex].height;

      aAngles[i] = angle;
      aHeights[i] = (i % CIRCLE_COUNT) * CIRCLE_HEIGHT - HEIGHT/2;
      aRadiuses[i] = RADIUS;
      aAspectRatios[i] = this.imageInfos[imageIndex].aspectRatio;
      aSpeeds[i] = speeds[i % CIRCLE_COUNT];
    }

    instancedMesh.geometry.setAttribute('aAngle',         new THREE.InstancedBufferAttribute(aAngles, 1));
    instancedMesh.geometry.setAttribute('aHeight',        new THREE.InstancedBufferAttribute(aHeights, 1));
    instancedMesh.geometry.setAttribute('aRadius',        new THREE.InstancedBufferAttribute(aRadiuses, 1));
    instancedMesh.geometry.setAttribute('aAspectRatio',   new THREE.InstancedBufferAttribute(aAspectRatios, 1));
    instancedMesh.geometry.setAttribute('aSpeed',         new THREE.InstancedBufferAttribute(aSpeeds, 1));
    instancedMesh.geometry.setAttribute('aTextureCoords', new THREE.InstancedBufferAttribute(aTextureCoords, 4));
    instancedMesh.geometry.setAttribute('aImageRes',      new THREE.InstancedBufferAttribute(aImagesRes, 2));

    this.scene.add(instancedMesh);
  }

  createCenteredMesh(){
    const geometry = new THREE.PlaneGeometry(1.7, 2.3);
    this.material = new THREE.ShaderMaterial({
      vertexShader: centerVertex,
      fragmentShader: centerFragment,
      uniforms:{
        uAtlas: new THREE.Uniform(this.atlasTexture),
        uTextureCoords: new THREE.Uniform(new THREE.Vector4(
          this.imageInfos[this.textureIndex].uvs.xStart,
          this.imageInfos[this.textureIndex].uvs.xEnd,
          this.imageInfos[this.textureIndex].uvs.yStart,
          this.imageInfos[this.textureIndex].uvs.yEnd
        ))
      }
    });
    this.mesh = new THREE.Mesh(geometry, this.material);
    this.scene.add(this.mesh);
  }

  updateScroll(scrollY, direction){
    this.scrollY.direction = direction;
    this.scrollY.speedTarget += scrollY;
    this.scrollY.target += scrollY;
  }

  render(time){
    if(!this.instancedMaterial || !this.material) return;
    this.instancedMaterial.uniforms.uTime.value = time;
    this.scrollY.target += 0.015 * this.scrollY.direction;
    this.scrollY.speedTarget += 0.015 * this.scrollY.direction;

    this.textureIndex = Math.abs(
      Math.floor(this.scrollY.speedTarget % (this.imageInfos.length - 1))
    );

    this.material.uniforms.uTextureCoords.value.set(
      this.imageInfos[this.textureIndex].uvs.xStart,
      this.imageInfos[this.textureIndex].uvs.xEnd,
      this.imageInfos[this.textureIndex].uvs.yStart,
      this.imageInfos[this.textureIndex].uvs.yEnd
    );

    this.scrollY.current = gsap.utils.interpolate(this.scrollY.current, this.scrollY.target, 0.1);
    this.scrollY.speedCurrent = gsap.utils.interpolate(this.scrollY.speedCurrent, this.scrollY.speedTarget, 0.1);

    this.instancedMaterial.uniforms.uScrollY.value = this.scrollY.current;
    this.instancedMaterial.uniforms.uSpeedY.value  = this.scrollY.speedCurrent;
    this.instancedMaterial.uniforms.uDirection.value = this.scrollY.direction;
  }
}

/* ============ Canvas (port of src/canvas.ts) ============ */
class VortexCanvas{
  constructor(){
    this.element = document.getElementById('webgl');
    this.time = 0;
    this.lastDirection = 1;

    this.clock = new THREE.Clock();
    this.scene = new THREE.Scene();

    this.camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 200);
    this.scene.add(this.camera);
    this.camera.position.z = 5;

    this.renderer = new THREE.WebGLRenderer({ canvas:this.element, alpha:true, antialias:true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));

    this.setSizes();
    this.addEventListeners();

    this.gallery = new Gallery({ scene:this.scene, cameraZ:this.camera.position.z });
  }

  setSizes(){
    const fov = this.camera.fov * (Math.PI / 180);
    const height = this.camera.position.z * Math.tan(fov / 2) * 2;
    const width = height * this.camera.aspect;
    this.sizes = { width, height };
  }

  addEventListeners(){
    window.addEventListener('resize', this.onResize.bind(this));
    window.addEventListener('wheel', this.onWheel.bind(this), { passive:true });
    // touch drag for mobile
    let lastY = 0, dragging = false;
    window.addEventListener('touchstart', e=>{ if(e.touches[0]){ lastY = e.touches[0].clientY; dragging = true; } }, { passive:true });
    window.addEventListener('touchmove', e=>{
      if(!dragging || !e.touches[0]) return;
      const y = e.touches[0].clientY;
      const dy = lastY - y;
      lastY = y;
      const dir = dy > 0 ? 1 : -1;
      this.lastDirection = dir;
      this.gallery.updateScroll((dy * 0.05 * this.sizes.height) / window.innerHeight, dir);
    }, { passive:true });
    window.addEventListener('touchend', ()=>{ dragging = false; }, { passive:true });
  }

  onResize(){
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.setSizes();
    this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  }

  onWheel(event){
    const normalizedWheel = normalizeWheel(event);
    const delta = event.deltaY;
    let value = Math.sign(delta);
    if(delta === 0){
      value = this.lastDirection;
    }else{
      this.lastDirection = value;
    }
    this.gallery.updateScroll(
      (normalizedWheel.pixelY * this.sizes.height) / window.innerHeight,
      this.lastDirection
    );
  }

  render(){
    this.time = this.clock.getElapsedTime();
    if(this.gallery) this.gallery.render(this.time);
    this.renderer.render(this.scene, this.camera);
  }
}

const app = new VortexCanvas();
function loop(){
  app.render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* hide loading once atlas ready */
window.addEventListener('vortex-ready', ()=>{
  setTimeout(()=>{ document.getElementById('loading').classList.add('gone'); }, 200);
});
/* fade hint after 4s */
setTimeout(()=>{ const h = document.querySelector('.hint'); if(h) h.style.opacity = '0'; }, 5000);
</script>
